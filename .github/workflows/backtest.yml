name: Backtest

# Weekly refresh of the backtest page (it changes slowly), plus manual runs.
# Saturday 07:00 JST = Friday 22:00 UTC.
on:
  schedule:
    - cron: "0 22 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backtest and build page
        run: python backend/scripts/run_backtest.py

      - name: Commit backtest page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: backtest refresh $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push retry $i"; sleep 5
            done
          fi
