name: Morning Routine

# 朝の一連(テーマニュース → 個別分析 → 寄り付き前アウトルック+買い候補ランキングをDiscord通知)を
# 1ジョブで順番に実行し、docs をまとめてコミットする。
#
# GitHub の schedule は遅延・取りこぼしがあるため、朝の時間帯に複数回スケジュールし、
# 「その日すでに実行済みなら以降はスキップ」ガードで重複通知を防ぐ(= 最低1通は届く)。
# concurrency で直列化しているので、先に動いた実行がマーカーをコミット→後続はスキップ。
#
# さらに分単位の正確さが必要なら、外部cron(cron-job.org 等)から下記APIを叩いて起動:
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/morning-routine.yml/dispatches
#   Header: Authorization: Bearer <PAT>, Accept: application/vnd.github+json  /  Body: {"ref":"main"}
#
# 2026-10 実測: 06:30〜07:50 の予定が毎回 2.5〜4 時間遅れて起動(9時過ぎ着)。そのため
# 03時台〜05時台にも予定を入れ、遅延込みで 06〜08時台に着地させる。06:10 より前に
# 起動した回(=遅延しなかった回)は米国の引け前なので何もせず終了し、後続に任せる。
on:
  workflow_dispatch: {}
  schedule:                    # 時刻は JST。平日 = UTC 日〜木。毎時 0 分/30 分は混むので避ける
    - cron: "17 18 * * 0-4"   # 03:17 JST(遅延込みで 06 時台に着地する想定)
    - cron: "47 18 * * 0-4"   # 03:47
    - cron: "17 19 * * 0-4"   # 04:17
    - cron: "47 19 * * 0-4"   # 04:47
    - cron: "17 20 * * 0-4"   # 05:17
    - cron: "47 20 * * 0-4"   # 05:47
    - cron: "23 21 * * 0-4"   # 06:23(遅延しなかった場合の本命)
    - cron: "53 21 * * 0-4"   # 06:53
    - cron: "23 22 * * 0-4"   # 07:23
    - cron: "53 22 * * 0-4"   # 07:53

permissions:
  contents: write

concurrency:
  group: morning-routine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — skip if already run today (JST)
        id: guard
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          now=$(TZ=Asia/Tokyo date +%H%M)
          echo "today=$today now=$now JST event=${{ github.event_name }}"
          if [ -f docs/.morning_state.json ] && grep -q "\"date\": \"$today\"" docs/.morning_state.json; then
            echo "Already ran today ($today) — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && (( 10#$now < 610 )); then
            # Too early: the US session / futures have not closed yet. Leave it to a later run.
            echo "Too early ($now JST, before 06:10) — skipping without marking."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r backend/requirements.txt

      - name: 1) Theme news
        if: steps.guard.outputs.skip != 'true'
        run: python backend/scripts/run_news.py

      - name: 2) Per-stock analysis
        if: steps.guard.outputs.skip != 'true'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python backend/scripts/run_stock_analysis.py

      - name: 3) Outlook + buy-candidate ranking -> Discord
        if: steps.guard.outputs.skip != 'true'
        env:
          ANALYZE_DISCORD_WEBHOOK_URL: ${{ secrets.ANALYZE_DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python backend/scripts/run_cloud.py

      - name: Mark done + commit docs
        if: steps.guard.outputs.skip != 'true'
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          mkdir -p docs
          echo "{\"date\": \"$today\"}" > docs/.morning_state.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: morning routine $today"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push retry $i"; sleep 5
            done
          fi
