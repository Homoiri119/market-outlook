name: News

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 22 * * 0-4"   # 07:00 JST weekdays

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Fetch news and build page
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python backend/scripts/run_news.py
      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: news $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push retry $i"; sleep 5
            done
          fi
