name: Inverse Backtest

# 悪いトレード手法の「逆」と、材料・テーマで個別株を選ぶ手法を、
# 日付指定の全銘柄日足(=当時の上場銘柄、上場廃止銘柄を含む)で検証する。
# 約3.8年分を1営業日ずつ取得するため重い → 手動実行のみ。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: inverse-backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run inverse backtest
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python backend/scripts/run_inverse_backtest.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/inverse_backtest_*.md reports/inverse_backtest_results.json reports/catalyst_backtest_*.md reports/catalyst_backtest_results.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: inverse backtest $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push retry $i"; sleep 5
            done
          fi
