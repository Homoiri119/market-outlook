name: Portfolio Backfill

# 過去のDiscord推奨(backend/data/recos_backfill.json)を遡ってペーパー建玉に登録し、
# J-Quantsの株価で再評価して docs/portfolio.* を作り直す。手動実行のみ。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: portfolio-backfill
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Backfill portfolio from past recommendations
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python backend/scripts/run_portfolio_backfill.py

      - name: Commit portfolio page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: portfolio backfill $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push retry $i"; sleep 5
            done
          fi
