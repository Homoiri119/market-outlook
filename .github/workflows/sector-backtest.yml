name: Sector Backtest

# Manual sector-level backtest (J-Quants V2). Fetches ~100 large-cap stocks, so it
# is run on demand rather than on a schedule.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sector-backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run sector backtest and build page
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python backend/scripts/run_sector_backtest.py

      - name: Commit sector backtest page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sector backtest $(date -u +%Y-%m-%d)"
            git push
          fi
