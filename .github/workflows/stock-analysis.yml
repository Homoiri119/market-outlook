name: Stock Analysis

# Per-stock technical + fundamental analysis with ATR-based entry/TP/SL.
# Fetches large-cap + watchlist stocks from J-Quants, so run manually or daily.
on:
  # 定時実行は Morning Routine に集約。ここは手動用。
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run stock analysis and build page
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python backend/scripts/run_stock_analysis.py

      - name: Commit analysis page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: stock analysis $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push retry $i"; sleep 5
            done
          fi
