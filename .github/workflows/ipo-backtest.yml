name: IPO Backtest

# IPOセカンダリー(初値買い→N日保有)のバックテスト。
# 上場銘柄を走査するため重め → 月1のバッチ + 手動実行。
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 20 1 * *"   # 毎月1日 05:00 JST

permissions:
  contents: write

concurrency:
  group: ipo-backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run IPO backtest and build page
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python backend/scripts/run_ipo_backtest.py

      - name: Commit IPO page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: ipo backtest $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push retry $i"; sleep 5
            done
          fi
