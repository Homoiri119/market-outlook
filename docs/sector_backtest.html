  .empty{color:var(--muted);padding:2rem 0;text-align:center;}
  .hdr{display:flex;gap:.6rem;font-size:.72rem;color:var(--muted);margin-bottom:.3rem;}
  .hdr .nm{width:12rem;}.hdr .mid{flex:1;}.hdr .val{width:3.5rem;text-align:right;}.hdr .strat{width:6rem;text-align:right;}
</style>

  <header>
    <h1>🏭 セクター別バックテスト(S17・ウォークフォワード)</h1>
    <a class="back" href="./backtest.html">← 指数バックテストへ</a>
  </header>
  <div class="sub" id="sub"></div>
  <div id="content"><div class="empty">読み込み中...</div></div>
</div>
<script>
function pct(v,d=1){return v==null?"N/A":(v*100).toFixed(d)+"%";}

function render(bt){
  document.getElementById("sub").textContent =
    `${bt.classification} ・ 検証 ${bt.start}〜${bt.end} ・ 大型株ユニバース ${bt.universe_size}銘柄 ・ ` +
    `予測=寄り付きギャップ / 売買=寄り建て→引け ・ 学習は各時点それ以前のみ(先読みなし)`;
  const secs = bt.sectors || [];
  if(!secs.length){document.getElementById("content").innerHTML=`<div class="empty">データがありません。</div>`;return;}
  const rows = secs.map(s=>{
    const w = Math.round(s.hit_rate*100);
    const color = s.hit_rate>=0.55?"var(--up)":s.hit_rate<0.5?"var(--down)":"var(--muted)";
    const sc = s.strategy_return>=0?"pos":"neg";
    return `<div class="bar-row">
      <span class="nm" title="${s.name}">${s.name}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
      <span class="val">${w}%</span>
      <span class="strat ${sc}">${pct(s.strategy_return,0)}</span>
    </div>`;
  }).join("");
  document.getElementById("content").innerHTML =
    `<section class="card">
       <h2 style="font-size:.95rem;color:var(--muted);margin:0 0 .5rem">寄り付き方向 的中率(セクター別・高い順)</h2>
       <div class="hdr"><span class="nm">セクター</span><span class="mid"></span><span class="val">的中率</span><span class="strat">戦略(寄→引)</span></div>
       ${rows}
     </section>
     <section class="card"><div class="disc">
       各S17セクターについて、大型株(TOPIX Core30+Large70相当)を時価総額加重で集計したセクター系列を作成し、
       米国終値の特徴量から翌営業日の寄り付きギャップを予測(ウォークフォワード=先読みなし)。的中率はギャップ方向、
       戦略は寄り付きで建て大引けで手仕舞う(寄→引)取引可能な損益(ギャップ自体は約定不可)。J-Quants V2データ使用。
       配当・手数料・スリッページ未考慮。過去の成績は将来を保証しません。
     </div></section>`;
}

if(window.__SBT__){ render(window.__SBT__); }
else {
  fetch("./sector_backtest.json").then(r=>r.ok?r.json():Promise.reject(r.status)).then(render)
    .catch(()=>{document.getElementById("content").innerHTML=`<div class="empty">セクター別バックテスト結果がまだありません(J-Quantsワークフローの実行後に表示)。</div>`;});
}
</script>
