<title>東京市場 寄り付き前アウトルック</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --line: #334155;
    --up: #22c55e;
    --up-bg: rgba(34, 197, 94, 0.12);
    --down: #ef4444;
    --down-bg: rgba(239, 68, 68, 0.12);
    --flat: #94a3b8;
    --flat-bg: rgba(148, 163, 184, 0.12);
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.25rem;
  }
  header h1 { font-size: 1.15rem; margin: 0; font-weight: 700; }
  .updated { color: var(--muted); font-size: 0.8rem; }
  .btns { display: flex; gap: 0.5rem; align-items: center; }
  button {
    background: var(--accent); color: #04222e; border: none; font-weight: 700;
    padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: 0.5; cursor: default; }
  .btlink {
    display: inline-block; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.85rem;
    font-weight: 700; text-decoration: none; color: var(--text); border: 1px solid var(--accent);
  }

  .hero {
    display: grid; grid-template-columns: 200px 1fr; gap: 1.25rem;
    background: var(--panel); border-radius: 16px; padding: 1.5rem;
    border-left: 8px solid var(--flat);
  }
  .hero.up { border-left-color: var(--up); }
  .hero.down { border-left-color: var(--down); }
  .badge {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 12px; padding: 1rem; text-align: center;
    background: var(--flat-bg);
  }
  .hero.up .badge { background: var(--up-bg); }
  .hero.down .badge { background: var(--down-bg); }
  .badge .emoji { font-size: 3rem; line-height: 1; }
  .badge .label { font-size: 1.5rem; font-weight: 800; margin-top: 0.5rem; }
  .hero.up .badge .label { color: var(--up); }
  .hero.down .badge .label { color: var(--down); }
  .badge .label.flat { color: var(--flat); }

  .move { font-size: 1rem; color: var(--muted); }
  .move .big { font-size: 2.4rem; font-weight: 800; color: var(--text); display: block; line-height: 1.1; }
  .hero.up .move .big { color: var(--up); }
  .hero.down .move .big { color: var(--down); }
  .conf { color: var(--muted); font-size: 0.85rem; margin-top: 0.15rem; }

  .nikkei-line {
    display: flex; align-items: center; gap: 0.75rem; margin: 1rem 0 0.25rem;
    font-size: 1.1rem; font-weight: 700; flex-wrap: wrap;
  }
  .nikkei-line .arrow { color: var(--muted); }
  .nikkei-line .from { color: var(--muted); font-weight: 600; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.75rem; margin-top: 1.25rem;
  }
  .cell { background: var(--panel-2); border-radius: 10px; padding: 0.7rem 0.85rem; }
  .cell .k { font-size: 0.7rem; color: var(--muted); display: block; margin-bottom: 0.2rem; }
  .cell .v { font-size: 1.05rem; font-weight: 700; }
  .v.pos { color: var(--up); } .v.neg { color: var(--down); }

  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
  .chip {
    background: var(--panel-2); border-radius: 999px; padding: 0.3rem 0.7rem;
    font-size: 0.8rem; font-weight: 600;
  }
  .chip .cv.pos { color: var(--up); } .chip .cv.neg { color: var(--down); }
  .chip .cn { color: var(--muted); margin-right: 0.3rem; font-weight: 500; }

  section.card { background: var(--panel); border-radius: 16px; padding: 1.25rem 1.5rem; margin-top: 1.25rem; }
  section.card h2 { font-size: 0.95rem; margin: 0 0 0.75rem; color: var(--muted); font-weight: 600; }
  .narrative { white-space: pre-wrap; line-height: 1.7; font-size: 0.92rem; }

  .range-line { margin: 0.35rem 0 0.15rem; font-size: 0.95rem; }
  .range-line b { font-weight: 700; }

  /* context + accuracy grids */
  .ctx-grid, .acc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; }
  .ctx-item, .acc-item { background: var(--panel-2); border-radius: 12px; padding: 0.8rem 0.9rem; }
  .ctx-item .k, .acc-item .k { font-size: 0.72rem; color: var(--muted); display: block; }
  .ctx-item .v, .acc-item .v { font-size: 1.4rem; font-weight: 800; }
  .ctx-item .v.pos, .acc-item .v.pos { color: var(--up); }
  .ctx-item .v.neg, .acc-item .v.neg { color: var(--down); }
  .ctx-item .note, .acc-item .note { font-size: 0.72rem; color: var(--muted); display: block; margin-top: 0.15rem; }

  svg { width: 100%; height: 220px; display: block; }
  .axis { stroke: var(--line); stroke-width: 1; }
  .zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.6; }
  .spark { fill: none; stroke: var(--accent); stroke-width: 2; }
  .spark2 { fill: none; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 5 3; }
  .dot { fill: var(--accent); }
  .dot2 { fill: #f59e0b; }
  .glabel { fill: var(--muted); font-size: 10px; }
  .legend { display: flex; gap: 0.9rem; font-size: 0.78rem; color: var(--muted); }
  .legend .lg { display: flex; align-items: center; gap: 0.3rem; }
  .legend .sw { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend .sw1 { background: var(--accent); }
  .legend .sw2 { background: #f59e0b; }

  /* US market section */
  .us-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .sentiment { font-size: 0.78rem; font-weight: 700; padding: 0.25rem 0.7rem; border-radius: 999px; }
  .sentiment.risk_on { background: var(--up-bg); color: var(--up); }
  .sentiment.risk_off { background: var(--down-bg); color: var(--down); }
  .sentiment.neutral { background: var(--flat-bg); color: var(--flat); }
  .us-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.6rem; margin-top: 0.85rem; }
  .us-item {
    background: var(--panel-2); border-radius: 12px; padding: 0.8rem 0.9rem;
    border-top: 3px solid var(--flat);
  }
  .us-item.pos { border-top-color: var(--up); }
  .us-item.neg { border-top-color: var(--down); }
  .us-item .name { font-size: 0.75rem; color: var(--muted); }
  .us-item .val { font-size: 1.3rem; font-weight: 800; margin-top: 0.15rem; }
  .us-item.pos .val { color: var(--up); }
  .us-item.neg .val { color: var(--down); }
  .us-item .note { font-size: 0.72rem; color: var(--muted); margin-top: 0.1rem; }

  /* sector heatmap */
  .sector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.5rem; }
  .sector-tile { border-radius: 10px; padding: 0.7rem 0.8rem; border: 1px solid var(--line); }
  .sector-tile .sname { font-size: 0.85rem; font-weight: 700; }
  .sector-tile .sscore { font-size: 1.15rem; font-weight: 800; margin-top: 0.15rem; }
  .sector-tile .sdriver { font-size: 0.68rem; color: var(--muted); margin-top: 0.1rem; }

  .muted { color: var(--muted); }
  .error { background: var(--down-bg); color: #fecaca; padding: 0.75rem 1rem; border-radius: 10px; margin-bottom: 1rem; }
  .empty { color: var(--muted); padding: 2rem 0; text-align: center; }
  @media (max-width: 620px) {
    .hero { grid-template-columns: 1fr; }
  }
</style>

<script>
const DIR = {
  STRONG_UP: { emoji: "🚀", label: "大幅上昇", cls: "up" },
  UP:        { emoji: "📈", label: "上昇",     cls: "up" },
  FLAT:      { emoji: "➡️", label: "ほぼ横ばい", cls: "flat" },
  DOWN:      { emoji: "📉", label: "下落",     cls: "down" },
  STRONG_DOWN:{ emoji: "⚠️", label: "大幅下落", cls: "down" },
};

function pct(v, d = 2) { return v == null ? "N/A" : (v * 100).toFixed(d) + "%"; }
function num(v) { return v == null ? "N/A" : Math.round(v).toLocaleString(); }
function sign(v) { return v == null ? "" : (v >= 0 ? "pos" : "neg"); }

async function getJSON(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + " → " + r.status + " " + (await r.text()));
  return r.json();
}

function renderHero(o) {
  const d = DIR[o.direction] || DIR.FLAT;
  const heroCls = d.cls === "up" ? "up" : d.cls === "down" ? "down" : "";
  const us = o.us_detail || "";
  return `
  <div class="hero ${heroCls}">
    <div class="badge">
      <div class="emoji">${d.emoji}</div>
      <div class="label ${d.cls === "flat" ? "flat" : ""}">${d.label}</div>
    </div>
    <div>
      <div class="move">予想寄り付き<span class="big">${pct(o.expected_move)}</span></div>
      <div class="conf">信頼度 ${o.confidence.toFixed(2)} ・ ${o.date}</div>
      <div class="nikkei-line">
        <span class="from">前日終値 ${num(o.nikkei_prev_close)}</span>
        <span class="arrow">→</span>
        <span>予想寄り ${num(o.implied_open_level)}</span>
      </div>
      ${o.expected_open_low != null && o.expected_open_high != null ? `<div class="range-line">予想レンジ <b>${num(o.expected_open_low)} 〜 ${num(o.expected_open_high)}</b> <span class="muted">(${pct(o.expected_range_low)} 〜 ${pct(o.expected_range_high)})</span></div>` : ""}
      <div class="grid">
        <div class="cell"><span class="k">先物ギャップ(主指標)</span><span class="v ${sign(o.implied_gap)}">${pct(o.implied_gap)}</span></div>
        <div class="cell"><span class="k">回帰モデル予測</span><span class="v ${sign(o.model_return)}">${pct(o.model_return)}</span></div>
        <div class="cell"><span class="k">日経先物</span><span class="v">${o.nikkei_futures != null ? o.nikkei_futures.toLocaleString() : "N/A"}<span class="muted" style="font-size:.7rem"> ${o.futures_source || ""}</span></span></div>
        <div class="cell"><span class="k">前日 日経225終値</span><span class="v">${o.nikkei_prev_close != null ? o.nikkei_prev_close.toLocaleString() : "N/A"}</span></div>
      </div>
    </div>
  </div>`;
}

const SENTIMENT_LABEL = { risk_on: "リスクオン ↑", risk_off: "リスクオフ ↓", neutral: "中立 →" };

// display: the text shown as the big value. colorBy: the number driving color/arrow.
function usItem(name, { display, colorBy = null, invert = false, note = "" }) {
  if (display == null) {
    return `<div class="us-item"><div class="name">${name}</div><div class="val">N/A</div>${note ? `<div class="note">${note}</div>` : ""}</div>`;
  }
  const c = colorBy == null ? 0 : colorBy;
  // invert=true: a rising value is "bad" (e.g. VIX) → color inversely.
  const good = invert ? c < 0 : c > 0;
  const cls = c === 0 ? "" : good ? "pos" : "neg";
  const arrow = c > 0 ? "▲" : c < 0 ? "▼" : "―";
  return `<div class="us-item ${cls}"><div class="name">${name}</div>
    <div class="val">${arrow} ${display}</div>${note ? `<div class="note">${note}</div>` : ""}</div>`;
}

function signedPts(v, d = 1) { return v == null ? null : (v >= 0 ? "+" : "") + v.toFixed(d); }

function renderUS(o) {
  const m = o.us_market;
  if (!m) {
    // Fallback to the plain text summary when structured data is unavailable.
    return o.us_detail
      ? `<section class="card"><h2>米国市場(前日クローズ)</h2><div class="narrative">${o.us_detail}</div></section>`
      : "";
  }
  const sent = m.sentiment || "neutral";
  const dateTxt = m.date ? `(${m.date} クローズ)` : "";
  const fxNote = m.usdjpy_return == null ? "" : m.usdjpy_return > 0 ? "円安(輸出株に追い風)" : m.usdjpy_return < 0 ? "円高(輸出株に逆風)" : "";
  const items = [
    usItem("S&P500", { display: m.sp500_return != null ? pct(m.sp500_return) : null, colorBy: m.sp500_return }),
    usItem("NASDAQ", { display: m.nasdaq_return != null ? pct(m.nasdaq_return) : null, colorBy: m.nasdaq_return }),
    usItem("ダウ", { display: m.dow_return != null ? pct(m.dow_return) : null, colorBy: m.dow_return }),
    // VIX: show the level; color/arrow by its point change (a rise = risk-off, so invert).
    usItem("VIX(恐怖指数)", {
      display: m.vix_close != null ? m.vix_close.toFixed(1) : null,
      colorBy: m.vix_change, invert: true,
      note: m.vix_change != null ? `前日比 ${signedPts(m.vix_change)}` : "",
    }),
    usItem("USD/JPY", { display: m.usdjpy_return != null ? pct(m.usdjpy_return) : null, colorBy: m.usdjpy_return, note: fxNote }),
  ].join("");

  // Extra overnight indicators a JP investor checks pre-open.
  const hasExtra = m.sox_return != null || m.us10y_level != null || m.wti_return != null;
  const extraItems = [
    usItem("SOX半導体指数", {
      display: m.sox_return != null ? pct(m.sox_return) : null, colorBy: m.sox_return,
      note: "東エレク・アドバンテスト等に影響",
    }),
    usItem("米10年債利回り", {
      display: m.us10y_level != null ? m.us10y_level.toFixed(2) + "%" : null,
      colorBy: m.us10y_change_bp, invert: true,
      note: m.us10y_change_bp != null ? `前日比 ${signedPts(m.us10y_change_bp, 0)}bp` : "",
    }),
    usItem("WTI原油", {
      display: m.wti_return != null ? pct(m.wti_return) : null, colorBy: m.wti_return,
      note: m.wti_level != null ? `$${m.wti_level.toFixed(1)}` : "",
    }),
  ].join("");
  const extraBlock = hasExtra
    ? `<h2 style="margin:1rem 0 0">その他オーバーナイト</h2><div class="us-grid">${extraItems}</div>`
    : "";

  return `<section class="card">
    <div class="us-head"><h2 style="margin:0">米国市場 前日動向 <span class="muted" style="font-weight:400">${dateTxt}</span></h2>
      <span class="sentiment ${sent}">${SENTIMENT_LABEL[sent] || ""}</span></div>
    <div class="us-grid">${items}</div>
    ${extraBlock}
  </section>`;
}

const VIX_REGIME = {
  calm: { label: "平穏", cls: "risk_on" },
  watch: { label: "やや警戒", cls: "neutral" },
  elevated: { label: "警戒", cls: "risk_off" },
  fear: { label: "恐怖", cls: "risk_off" },
};

function renderContext(o) {
  const bits = [];
  if (o.nikkei_vs_ma25 != null) {
    const above = o.nikkei_vs_ma25 >= 0;
    const cls = above ? "pos" : "neg";
    const trend = above ? "上昇基調(25日線の上)" : "調整局面(25日線の下)";
    bits.push(`<div class="ctx-item"><span class="k">25日移動平均かい離</span>
      <span class="v ${cls}">${above ? "▲" : "▼"} ${pct(Math.abs(o.nikkei_vs_ma25))}</span>
      <span class="note">${trend}${o.nikkei_ma25 != null ? ` ・ 25日線 ${num(o.nikkei_ma25)}` : ""}</span></div>`);
  }
  if (o.vix_regime && VIX_REGIME[o.vix_regime]) {
    const r = VIX_REGIME[o.vix_regime];
    bits.push(`<div class="ctx-item"><span class="k">ボラティリティ地合い(VIX)</span>
      <span class="sentiment ${r.cls}" style="display:inline-block;margin-top:.15rem">${r.label}</span></div>`);
  }
  if (!bits.length) return "";
  return `<section class="card"><h2>市場コンテキスト</h2><div class="ctx-grid">${bits.join("")}</div></section>`;
}

function renderAccuracy(history) {
  const scored = (history || []).filter(h => h.actual_move != null && h.expected_move != null);
  if (!scored.length) {
    return `<section class="card"><h2>予測精度</h2><div class="muted">実績データを蓄積中です(寄り付き実績が判明した翌営業日以降に的中率を表示します)。</div></section>`;
  }
  const recent = scored.slice(-20);
  const hits = recent.filter(h => h.hit).length;
  const rate = hits / recent.length;
  const mae = recent.reduce((s, h) => s + Math.abs(h.expected_move - h.actual_move), 0) / recent.length;
  const rateCls = rate >= 0.6 ? "pos" : rate < 0.5 ? "neg" : "";
  return `<section class="card"><h2>予測精度(直近${recent.length}営業日)</h2>
    <div class="acc-grid">
      <div class="acc-item"><span class="k">方向 的中率</span><span class="v ${rateCls}">${(rate * 100).toFixed(0)}%</span><span class="note">${hits} / ${recent.length} 営業日</span></div>
      <div class="acc-item"><span class="k">平均誤差(予想−実績)</span><span class="v">±${(mae * 100).toFixed(2)}%</span><span class="note">寄り付きギャップの絶対誤差</span></div>
    </div></section>`;
}

function renderSectors(o) {
  const sectors = (o.sectors || []).filter(s => s.score != null);
  if (!sectors.length) return "";
  sectors.sort((a, b) => b.score - a.score);
  const tiles = sectors.map(s => {
    const intensity = Math.min(1, Math.abs(s.score) / 0.012);
    const rgb = s.score >= 0 ? "34,197,94" : "239,68,68";
    const bg = `rgba(${rgb}, ${(0.08 + 0.55 * intensity).toFixed(2)})`;
    const arrow = s.score > 0.0005 ? "▲" : s.score < -0.0005 ? "▼" : "―";
    return `<div class="sector-tile" style="background:${bg}">
      <div class="sname">${s.name}</div>
      <div class="sscore">${arrow} ${pct(s.score)}</div>
      <div class="sdriver">${s.driver}</div>
    </div>`;
  }).join("");
  return `<section class="card">
    <h2>セクター追い風/逆風マップ <span class="muted" style="font-weight:400;font-size:.78rem">※オーバーナイト要因からの示唆(ヒューリスティック)</span></h2>
    <div class="sector-grid">${tiles}</div>
  </section>`;
}

function renderNarrative(o) {
  if (!o.narrative) return "";
  return `<section class="card"><h2>解説</h2><div class="narrative">${o.narrative}</div></section>`;
}

function renderChart(history) {
  const rows = history.slice().reverse(); // oldest -> newest
  if (rows.length < 2) return "";
  const W = 960, H = 220, padL = 40, padR = 16, padT = 16, padB = 28;
  const pred = rows.map(r => r.expected_move * 100);
  const actual = rows.map(r => (r.actual_move != null ? r.actual_move * 100 : null));
  const allVals = pred.concat(actual.filter(v => v != null), [0]);
  let min = Math.min(...allVals), max = Math.max(...allVals);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.15 || 1; min -= pad; max += pad;
  const x = i => padL + (i * (W - padL - padR)) / (rows.length - 1);
  const y = v => padT + (H - padT - padB) * (1 - (v - min) / (max - min));
  const predPts = pred.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const predDots = pred.map((v, i) => `<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="2.5" />`).join("");
  // Actual line: only across points that have a realized value (may have gaps at the end).
  const actualSeg = actual.map((v, i) => (v != null ? `${x(i)},${y(v)}` : null)).filter(Boolean).join(" ");
  const actualDots = actual.map((v, i) => (v != null ? `<circle class="dot2" cx="${x(i)}" cy="${y(v)}" r="2.5" />` : "")).join("");
  const zeroY = y(0);
  const firstLabel = rows[0].date.slice(5);
  const lastLabel = rows[rows.length - 1].date.slice(5);
  const hasActual = actual.some(v => v != null);
  const legend = `<span class="lg"><span class="sw sw1"></span>予測</span>${hasActual ? `<span class="lg"><span class="sw sw2"></span>実績(寄り付き)</span>` : ""}`;
  return `
  <section class="card">
    <div class="us-head"><h2 style="margin:0">アウトルック履歴 予測 vs 実績(寄り付きリターン %)</h2><div class="legend">${legend}</div></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line class="axis" x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" />
      <line class="zero" x1="${padL}" y1="${zeroY}" x2="${W - padR}" y2="${zeroY}" />
      ${actualSeg ? `<polyline class="spark2" points="${actualSeg}" />` : ""}
      <polyline class="spark" points="${predPts}" />
      ${actualDots}${predDots}
      <text class="glabel" x="${padL}" y="${H - 8}">${firstLabel}</text>
      <text class="glabel" x="${W - padR}" y="${H - 8}" text-anchor="end">${lastLabel}</text>
      <text class="glabel" x="4" y="${y(max) + 4}">${max.toFixed(2)}</text>
      <text class="glabel" x="4" y="${y(min) + 4}">${min.toFixed(2)}</text>
    </svg>
  </section>`;
}

function renderInto(o, history, updatedText) {
  const content = document.getElementById("content");
  if (!o) {
    content.innerHTML = `<div class="empty">まだアウトルックがありません。「最新データで再計算」を押してください。</div>`;
    return;
  }
  content.innerHTML =
    renderHero(o) +
    renderAccuracy(history || []) +
    renderContext(o) +
    renderUS(o) +
    renderSectors(o) +
    renderNarrative(o) +
    renderChart(history || []);
  document.getElementById("updated").textContent = updatedText;
}

async function load() {
  const err = document.getElementById("err");
  err.innerHTML = "";
  try {
    const [o, history] = await Promise.all([
      getJSON("/api/outlook/latest"),
      getJSON("/api/outlook/history?limit=30"),
    ]);
    renderInto(o, history, "最終更新: " + new Date().toLocaleString("ja-JP"));
  } catch (e) {
    err.innerHTML = `<div class="error">${e.message}</div>`;
  }
}

async function refresh() {
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "計算中...";
  document.getElementById("err").innerHTML = "";
  try {
    await fetch("/api/outlook/run", { method: "POST" }).then(async r => {
      if (!r.ok) throw new Error("再計算に失敗: " + r.status + " " + (await r.text()));
    });
    await load();
  } catch (e) {
    document.getElementById("err").innerHTML = `<div class="error">${e.message}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "最新データで再計算";
  }
}

// Dual mode:
//  - Live mode (served by FastAPI): fetch from the API, refresh button enabled.
//  - Static mode (GitHub Pages): window.__DATA__ is injected with baked-in data;
//    no backend, so hide the action buttons and render directly.
if (window.__DATA__) {
  const d = window.__DATA__;
  // Static (GitHub Pages) mode: no backend, so hide the action buttons but keep the
  // backtest link usable.
  document.getElementById("refresh").style.display = "none";
  document.getElementById("reload").style.display = "none";
  renderInto(d.outlook, d.history, "自動更新: 毎朝8:00 JST (GitHub Actions) ・ 生成 " + (d.generated_at || ""));
} else {
  document.getElementById("refresh").addEventListener("click", refresh);
  document.getElementById("reload").addEventListener("click", load);
  load();
}
</script>
</body>
</html>
