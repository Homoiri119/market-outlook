  <header><h1>💼 推奨銘柄の実績(ペーパー運用トラッキング)</h1></header>
  <div class="sub" id="sub"></div>
  <div id="content"><div class="empty">読み込み中...</div></div>
</div>
<script>
function yen(v){return v==null?"—":(v>=0?"+":"")+Math.round(v).toLocaleString()+"円";}
function yen0(v){return v==null?"—":Math.round(v).toLocaleString()+"円";}
function pct(v,d=1){return v==null?"—":(v*100>=0?"+":"")+(v*100).toFixed(d)+"%";}

function kpis(d){
  const col=d.total_pnl>=0?"var(--up)":"var(--down)";
  return `<div class="kpis">
    <div class="kpi"><div class="k">初期資金</div><div class="v">${yen0(d.initial_capital)}</div></div>
    <div class="kpi"><div class="k">現在の評価額</div><div class="v">${yen0(d.equity)}</div></div>
    <div class="kpi"><div class="k">総損益</div><div class="v" style="color:${col}">${yen(d.total_pnl)}</div><div class="k" style="color:${col}">${pct(d.total_pnl_pct)}</div></div>
    <div class="kpi"><div class="k">確定 / 含み</div><div class="v" style="font-size:1rem">${yen(d.realized)}<br>${yen(d.unrealized)}</div></div>
    <div class="kpi"><div class="k">勝率(確定)</div><div class="v">${d.win_rate==null?"—":(d.win_rate*100).toFixed(0)+"%"}</div><div class="k">${d.n_open}保有 / ${d.n_closed}決済</div></div>
  </div>`;
}

function equity(d){
  const pts=d.curve||[];
  if(pts.length<2) return `<section class="card"><h2>評価額の推移</h2><div class="muted">まだ推移を描くデータがありません(数日の運用後に表示)。</div></section>`;
  const W=960,H=300,padL=70,padR=20,padT=14,padB=24;
  let vals=pts.map(p=>p.equity); const base=d.initial_capital; vals.push(base);
  let min=Math.min(...vals),max=Math.max(...vals);const pad=(max-min)*0.08||1;min-=pad;max+=pad;
  const x=i=>padL+(i*(W-padL-padR))/(pts.length-1);
  const y=v=>padT+(H-padT-padB)*(1-(v-min)/(max-min));
  const line=pts.map((p,i)=>`${x(i)},${y(p.equity)}`).join(" ");
  const baseY=y(base), last=pts[pts.length-1].equity;
  const col=last>=base?"var(--up)":"var(--down)";
  return `<section class="card">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <h2 style="margin:0">評価額の推移</h2>
      <div style="font-weight:700;color:${col}">${yen0(last)} (${yen(last-base)})</div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".5"/>
      <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2"/>
      <text class="glabel" x="4" y="${y(max)+4}">${Math.round(max).toLocaleString()}</text>
      <text class="glabel" x="4" y="${baseY+4}">初期 ${Math.round(base).toLocaleString()}</text>
      <text class="glabel" x="4" y="${y(min)+4}">${Math.round(min).toLocaleString()}</text>
    </svg>
    <div class="muted" style="font-size:.75rem;margin-top:.3rem">初期資金からの評価額。確定損益で階段状に動き、右端は含み損益も反映した現在値。</div>
  </section>`;
}

function positions(d){
  if(!d.positions||!d.positions.length) return `<section class="card"><h2>建玉一覧</h2><div class="muted">まだ推奨から記録された建玉がありません。</div></section>`;
  const rows=d.positions.map(p=>{
    const badge = p.status==="open" ? `<span class="badge b-open">保有中</span>`
      : (p.reason==="利確" ? `<span class="badge b-tp">利確</span>` : `<span class="badge b-sl">損切</span>`);
    const px = p.status==="open" ? p.last_price : p.exit_price;
    const cls = p.pnl>=0?"pos":"neg";
    return `<tr>
      <td>${p.date}</td>
      <td>${p.name}<span class="muted">(${p.code})</span> ${badge}</td>
      <td>${Math.round(p.entry).toLocaleString()}</td>
      <td class="muted">${Math.round(p.stop_loss).toLocaleString()}/${Math.round(p.take_profit).toLocaleString()}</td>
      <td>${p.shares.toLocaleString()}</td>
      <td>${px==null?"—":Math.round(px).toLocaleString()}</td>
      <td class="${cls}">${yen(p.pnl)}</td>
      <td class="${cls}">${pct(p.pnl_pct)}</td>
    </tr>`;
  }).join("");
  return `<section class="card"><h2>建玉一覧(新しい順)</h2>
    <div style="overflow-x:auto"><table>
    <thead><tr><th>推奨日</th><th>銘柄</th><th>イン</th><th>損切/利確</th><th>株数</th><th>現在/決済</th><th>損益</th><th>率</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="muted" style="font-size:.75rem;margin-top:.5rem">保有中=含み損益(直近終値で評価)。決済=損切または利確に到達して確定。買い候補に挙がった全銘柄を記録(建玉数の上限なし)。1トレードのリスクは初期資金の${(d.risk_pct*100).toFixed(0)}%固定・単元100株。</div>
  </section>`;
}

function render(d){
  document.getElementById("sub").textContent =
    `Discordの買い候補を自動記録・追跡 ・ 初期資金 ${yen0(d.initial_capital)} ・ 1回リスク ${(d.risk_pct*100).toFixed(0)}% ・ 生成 ${d.generated_at||""}`;
  document.getElementById("content").innerHTML =
    `<section class="card">${kpis(d)}</section>` +
    equity(d) + positions(d) +
    `<section class="card"><div class="disc">
      毎朝Discordに出す買い候補を、推奨時の価格でエントリーしたと仮定して記録し、その後のJ-Quants日足で損切・利確の到達を判定します。
      エントリーは推奨価格(前日終値ベース)を採用・手数料/スリッページ未考慮。買い候補の全銘柄を「1回=資金の1%リスク」で建てる戦略トラッカーで、現金制約は課していません(初期資金は評価額グラフの基準)。
      あくまで「推奨に従っていたら」を可視化するペーパー運用です。<b>投資助言ではありません。</b>
    </div></section>`;
}

if(window.__PF__){ render(window.__PF__); }
else { fetch("./portfolio.json").then(r=>r.ok?r.json():Promise.reject()).then(render)
  .catch(()=>{document.getElementById("content").innerHTML=`<div class="empty">まだ実績データがありません(翌朝の通知以降に記録が始まります)。</div>`;});}
</script>
