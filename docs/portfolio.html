    <a href="./news.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">📰 ニュース</a>
    <a href="./portfolio.html" style="color:#052132;background:#38bdf8;text-decoration:none;border:1px solid #38bdf8;border-radius:8px;padding:.4rem .7rem;font-weight:700">💼 実績</a>
    <a href="./stock_strategy.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🧪 戦略検証</a>
    <a href="./backtest.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">📊 バックテスト</a>
    <a href="./sector_backtest.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🏭 セクター</a>

  <header><h1>💼 推奨銘柄の実績(ペーパー運用トラッキング)</h1></header>
  <div class="sub" id="sub"></div>
  <div id="content"><div class="empty">読み込み中...</div></div>
</div>
<script>
function yen(v){return v==null?"—":(v>=0?"+":"")+Math.round(v).toLocaleString()+"円";}
function yen0(v){return v==null?"—":Math.round(v).toLocaleString()+"円";}
function pct(v,d=1){return v==null?"—":(v*100>=0?"+":"")+(v*100).toFixed(d)+"%";}

let DATA=null;
const LS_MODE="pf_mode2", LS_EXIT="pf_exit2", LS_REG="pf_reg";
const RISK_CAPITAL=1000000, RISK_PCT=0.01, LOT=100, ROUND=10000;
const DOWN_DAYS=["DOWN","STRONG_DOWN"];
function lsGet(k,ok,def){ try{const v=localStorage.getItem(k); if(ok.includes(v)) return v;}catch(e){} return def; }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
// Defaults follow the strategy review: R-based view, 5-day exit, skip down-forecast days.
function getMode(){ return lsGet(LS_MODE,["risk1","lot100"],"risk1"); }
function setMode(m){ lsSet(LS_MODE,m); }
function getExit(){ return lsGet(LS_EXIT,["fixed5","fixed","trail"],"fixed5"); }
function setExit(m){ lsSet(LS_EXIT,m); }
function getReg(){ return lsGet(LS_REG,["skip","all"],"skip"); }
function setReg(m){ lsSet(LS_REG,m); }

function sharesFor(mode,p){
  if(mode==="risk1"){
    // 1-share granularity (単元未満株): a 100-share floor would make one pricey stock
    // risk 20R+ and swamp the R-based view.
    const raw=RISK_CAPITAL*RISK_PCT/(p.entry-p.stop_loss);
    return Math.max(1, Math.floor(raw));
  }
  return LOT;
}
// Effective exit for the chosen method: 5-day (fixed TP/SL + time limit), fixed TP/SL, or trailing stop.
function eff(p,exitMethod){
  const pre = exitMethod==="trail" ? "trail_" : exitMethod==="fixed5" ? "f5_" : "";
  const st = (pre ? p[pre+"status"] : p.status) || "open";
  return {status:st, exit_date:p[pre+"exit_date"],
          px: st==="closed"? p[pre+"exit_price"] : p.last_price, reason:p[pre ? pre+"reason" : "reason"]};
}
function autoCapital(view){
  const dates=[...new Set(view.flatMap(p=>[p.date,p._exit_date].filter(Boolean)))].sort();
  let peak=0;
  for(const d of dates){ let c=0; for(const p of view){ const end=p._exit_date||"9999-12-31"; if(p.date<=d&&d<=end) c+=LOT*p.entry; } peak=Math.max(peak,c); }
  return (Math.floor(peak/ROUND)+1)*ROUND;
}
function compute(mode,exitMethod,reg){
  const all=DATA.positions||[];
  const ps = reg==="skip" ? all.filter(p=>!DOWN_DAYS.includes(p.reg_dir)) : all;
  const today=(DATA.curve&&DATA.curve.length)?DATA.curve[DATA.curve.length-1].date:new Date().toISOString().slice(0,10);
  const view=ps.map(p=>{ const sh=sharesFor(mode,p); const e=eff(p,exitMethod); const en=p.entry;
    return Object.assign({},p,{shares:sh, _status:e.status, _exit_date:e.exit_date, _reason:e.reason,
      _px:e.px, pnl:(e.px-en)*sh, pnl_pct:en?e.px/en-1:0}); });
  const capital = mode==="risk1" ? RISK_CAPITAL : autoCapital(view);
  const open=view.filter(p=>p._status==="open"), closed=view.filter(p=>p._status==="closed");
  const realized=closed.reduce((a,p)=>a+p.pnl,0), unreal=open.reduce((a,p)=>a+p.pnl,0);
  const deployed=open.reduce((a,p)=>a+p.shares*p.entry,0), wins=closed.filter(p=>p.pnl>0);
  let curve=[];
  if(view.length){
    const first=view.reduce((m,p)=>p.date<m?p.date:m, view[0].date);
    curve.push({date:first, equity:Math.round(capital)});
    let cum=0;
    for(const p of closed.slice().sort((a,b)=>(a._exit_date||"").localeCompare(b._exit_date||""))){ cum+=p.pnl; curve.push({date:p._exit_date, equity:Math.round(capital+cum)}); }
    curve.push({date:today, equity:Math.round(capital+realized+unreal)});
  }
  return {mode, exitMethod, reg, skipped: all.length-ps.length, capital, equity:Math.round(capital+realized+unreal), total_pnl:Math.round(realized+unreal),
    total_pnl_pct: capital?(realized+unreal)/capital:0, realized:Math.round(realized), unrealized:Math.round(unreal),
    deployed:Math.round(deployed), n_open:open.length, n_closed:closed.length,
    win_rate: closed.length? wins.length/closed.length : null,
    curve, positions: view.slice().sort((a,b)=>b.date.localeCompare(a.date))};
}

function toggle(mode,exitMethod,reg){
  const on="background:var(--accent);color:#052132;font-weight:700;";
  const off="background:var(--panel-2);color:var(--text);";
  const b=(attr,val,cur,l)=>`<button ${attr}="${val}" class="tg" style="border:none;padding:.42rem .9rem;cursor:pointer;font-size:.85rem;${cur===val?on:off}">${l}</button>`;
  const row=(label,btns,note,last)=>`<div style="display:flex;align-items:center;gap:.7rem;flex-wrap:wrap${last?"":";margin-bottom:.5rem"}">
      <span style="font-size:.85rem;color:var(--muted);min-width:5.5em">${label}</span>
      <div style="display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden">${btns}</div>
      <span class="muted" style="font-size:.75rem">${note}</span></div>`;
  const sizeNote = mode==="lot100"
    ? "全銘柄100株・運用資金は保有総額を自動設定(値嵩株の比重が大きい点に注意)。"
    : "1トレード=資金100万円の1%リスク(1株単位・単元未満株想定)。実力を測る基準。";
  const exitNote = {
    fixed5: "損切・利確+最長5営業日で手仕舞い(推奨ルール)。",
    fixed:  "損切・利確のみ・期限なし(旧ルール)。",
    trail:  "利確せず高値を追随する逆指値で手仕舞い。"}[exitMethod];
  const regNote = reg==="skip" ? "強下落・下落予想の日の推奨は買わない(推奨ルール)。" : "地合いに関係なく全て買う。";
  return `<section class="card">
    ${row("サイジング", b("data-m","risk1",mode,"リスク1%")+b("data-m","lot100",mode,"現物100株"), sizeNote)}
    ${row("決済方式", b("data-x","fixed5",exitMethod,"5日決済")+b("data-x","fixed",exitMethod,"固定利確")+b("data-x","trail",exitMethod,"トレール"), exitNote)}
    ${row("地合い", b("data-r","skip",reg,"下落日は見送り")+b("data-r","all",reg,"全て"), regNote, true)}
  </section>`;
}

function kpis(v){
  const col=v.total_pnl>=0?"var(--up)":"var(--down)";
  const depPct=v.capital? (v.deployed/v.capital*100).toFixed(0):"—";
  const capSub = v.mode==="lot100" ? "全建玉を100株買える額(自動)" : "基準額(1%=1万円/件)";
  return `<div class="kpis">
    <div class="kpi"><div class="k">${v.mode==="lot100"?"運用資金":"資金(基準)"}</div><div class="v">${yen0(v.capital)}</div><div class="k">${capSub}</div></div>
    <div class="kpi"><div class="k">評価額</div><div class="v">${yen0(v.equity)}</div></div>
    <div class="kpi"><div class="k">総損益(率)</div><div class="v" style="color:${col}">${pct(v.total_pnl_pct)}</div><div class="k" style="color:${col}">${yen(v.total_pnl)}</div></div>
    <div class="kpi"><div class="k">確定 / 含み</div><div class="v" style="font-size:1rem">${yen(v.realized)}<br>${yen(v.unrealized)}</div></div>
    <div class="kpi"><div class="k">投下資金(現建玉)</div><div class="v" style="font-size:1rem">${yen0(v.deployed)}</div><div class="k">資金の${depPct}% ・ ${v.n_open}保有/${v.n_closed}決済・勝率${v.win_rate==null?"—":(v.win_rate*100).toFixed(0)+"%"}</div></div>
  </div>`;
}

function equity(v){
  const pts=v.curve||[]; const base=v.capital;
  if(pts.length<2) return `<section class="card"><h2>評価額の推移</h2><div class="muted">まだ推移を描くデータがありません(数日の運用後に表示)。</div></section>`;
  const W=960,H=300,padL=84,padR=20,padT=14,padB=24;
  let vals=pts.map(p=>p.equity); vals.push(base);
  let min=Math.min(...vals),max=Math.max(...vals);const pad=(max-min)*0.08||1;min-=pad;max+=pad;
  const x=i=>padL+(i*(W-padL-padR))/(pts.length-1);
  const y=val=>padT+(H-padT-padB)*(1-(val-min)/(max-min));
  const line=pts.map((p,i)=>`${x(i)},${y(p.equity)}`).join(" ");
  const baseY=y(base), last=pts[pts.length-1].equity, lastPct=base?(last-base)/base:0;
  const col=last>=base?"var(--up)":"var(--down)";
  return `<section class="card">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <h2 style="margin:0">評価額の推移</h2>
      <div style="font-weight:700;color:${col}">${yen0(last)} (${pct(lastPct)})</div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".5"/>
      <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2"/>
      <text class="glabel" x="4" y="${y(max)+4}">${Math.round(max).toLocaleString()}</text>
      <text class="glabel" x="4" y="${baseY+4}">${v.mode==="lot100"?"運用資金":"基準"} ${Math.round(base).toLocaleString()}</text>
      <text class="glabel" x="4" y="${y(min)+4}">${Math.round(min).toLocaleString()}</text>
    </svg>
    <div class="muted" style="font-size:.75rem;margin-top:.3rem">基準額からの評価額。確定損益で階段状に動き、右端は含み損益も反映した現在値。</div>
  </section>`;
}

const REG={STRONG_UP:["🚀","強上昇","var(--up)"],UP:["📈","上昇","var(--up)"],FLAT:["➡️","横ばい","var(--muted)"],DOWN:["📉","下落","var(--down)"],STRONG_DOWN:["⚠️","強下落","var(--down)"]};
function regCell(p){
  const r=REG[p.reg_dir];
  if(!r) return `<td class="muted" style="text-align:left">—</td>`;
  const mv = p.reg_move!=null ? `<span class="muted"> ${(p.reg_move*100>=0?"+":"")+(p.reg_move*100).toFixed(1)}%</span>` : "";
  return `<td style="text-align:left;color:${r[2]};font-size:.82rem;white-space:nowrap">${r[0]}${r[1]}${mv}</td>`;
}

function positions(v){
  const ps=v.positions||[];
  if(!ps.length) return `<section class="card"><h2>建玉一覧</h2><div class="muted">まだ推奨から記録された建玉がありません。</div></section>`;
  const rows=ps.map(p=>{
    const badge = p.filled===false ? `<span class="badge b-open">寄り待ち</span>`
      : p._status==="open" ? `<span class="badge b-open">保有中</span>`
      : p._reason==="損切" ? `<span class="badge b-sl">損切</span>`
      : p._reason==="期限" ? `<span class="badge" style="background:#3b3416;color:#fcd34d">5日決済</span>`
      : `<span class="badge b-tp">${p._reason||"利確"}</span>`;
    const split = p.split_adj ? ` <span class="muted" style="font-size:.7rem">分割調整</span>` : "";
    const rec = (p.rec_entry!=null && Math.round(p.rec_entry)!==Math.round(p.entry))
      ? `<br><span class="muted" style="font-size:.72rem">推奨 ${Math.round(p.rec_entry).toLocaleString()}</span>` : "";
    const px = p._px;
    const cls = p.pnl>=0?"pos":"neg";
    return `<tr>
      <td>${p.date}</td>
      ${regCell(p)}
      <td>${p.name}<span class="muted">(${p.code})</span> ${badge}${split}</td>
      <td>${Math.round(p.entry).toLocaleString()}${rec}</td>
      <td class="muted">${Math.round(p.stop_loss).toLocaleString()}/${Math.round(p.take_profit).toLocaleString()}</td>
      <td>${p.shares.toLocaleString()}</td>
      <td>${px==null?"—":Math.round(px).toLocaleString()}</td>
      <td class="${cls}">${yen(p.pnl)}</td>
      <td class="${cls}">${pct(p.pnl_pct)}</td>
    </tr>`;
  }).join("");
  const sizeNote = v.mode==="lot100"
    ? "全銘柄を各100株で記録・運用資金は保有総額を自動設定(投下資金≤運用資金)。"
    : "1トレード=資金100万円の1%リスクでサイジング(1株単位、損失1回=約1万円)。";
  const exitNote = {
    fixed5: "決済=損切/利確、または買った日から5営業日後の引け(「5日決済」)。",
    fixed:  "決済=損切、または固定利確(+2.5ATR)に到達で確定。",
    trail:  "決済=損切、または高値追随のトレール(利確目標なし)。「トレール」は利が乗った状態での手仕舞い。"}[v.exitMethod];
  const tpHead = v.exitMethod==="trail" ? "損切/利確(未使用)" : "損切/利確";
  const skip = v.skipped ? ` 下落予想日の${v.skipped}件は見送りとして除外。` : "";
  return `<section class="card"><h2>建玉一覧(新しい順)</h2>
    <div style="overflow-x:auto"><table>
    <thead><tr><th>推奨日</th><th style="text-align:left">地合い</th><th>銘柄</th><th>イン(寄り値)</th><th>${tpHead}</th><th>株数</th><th>現在/決済</th><th>損益</th><th>率</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="muted" style="font-size:.75rem;margin-top:.5rem">保有中=含み損益(直近終値で評価)。インは推奨日の寄り値で、損切/利確はそこから置き直し(小さい「推奨」は前日終値ベースの推奨価格)。${exitNote} ${sizeNote}${skip}</div>
  </section>`;
}

function render(){
  const mode=getMode(), exitMethod=getExit(), reg=getReg(), v=compute(mode,exitMethod,reg);
  const exitLabel={fixed5:"5日決済",fixed:"固定利確",trail:"トレール"}[exitMethod];
  document.getElementById("sub").textContent =
    `Discordの買い候補を自動記録・追跡 ・ ${mode==="lot100"?"現物100株":"リスク1%"} / ${exitLabel} / ${reg==="skip"?"下落日は見送り":"全て"} ・ 生成 ${DATA.generated_at||""}`;
  document.getElementById("content").innerHTML =
    toggle(mode,exitMethod,reg) +
    `<section class="card">${kpis(v)}</section>` +
    equity(v) + positions(v) +
    `<section class="card"><div class="disc">
      毎朝Discordに出す買い候補を、<b>推奨日の寄り値で買った</b>と仮定して記録し、その後のJ-Quants日足で決済を判定します(窓を開けて損切・利確を飛び越えた日は寄り値で約定、株式分割は自動補正)。
      <b>推奨ルール</b>(戦略検証 2026-10-14):損切=寄り値−1.5ATR・利確=寄り値+2.5ATR・<b>最長5営業日</b>・<b>強下落/下落予想の日は見送り</b>。トグルで旧ルールと比較できます。
      手数料・スリッページ未考慮。<b>投資助言ではありません。</b>
    </div></section>`;
  document.querySelectorAll(".tg[data-m]").forEach(b=>b.onclick=()=>{ setMode(b.dataset.m); render(); });
  document.querySelectorAll(".tg[data-x]").forEach(b=>b.onclick=()=>{ setExit(b.dataset.x); render(); });
  document.querySelectorAll(".tg[data-r]").forEach(b=>b.onclick=()=>{ setReg(b.dataset.r); render(); });
}

function boot(d){ DATA=d; render(); }
if(window.__PF__){ boot(window.__PF__); }
else { fetch("./portfolio.json").then(r=>r.ok?r.json():Promise.reject()).then(boot)
  .catch(()=>{document.getElementById("content").innerHTML=`<div class="empty">まだ実績データがありません(翌朝の通知以降に記録が始まります)。</div>`;});}
</script>
</body>
