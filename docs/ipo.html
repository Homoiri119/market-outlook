  <header><h1>🆕 IPOセカンダリー投資 検証(初値買い→N日保有)</h1></header>
  <div class="sub" id="sub"></div>
  <div id="content"><div class="empty">読み込み中...</div></div>
</div>
<script>
function pct(v,d=1){return v==null?"—":(v*100>=0?"+":"")+(v*100).toFixed(d)+"%";}
function yen(v){return v==null?"—":(v>=0?"+":"")+Math.round(v).toLocaleString()+"円";}
function n0(v){return v==null?"—":Math.round(v).toLocaleString();}
let DATA=null, curHold=null;

function kpis(st,h){
  if(!st||!st.n) return `<div class="muted">この保有日数のサンプルがありません。</div>`;
  const col=st.median>0?"var(--up)":"var(--down)";
  return `<div class="kpis">
    <div class="kpi"><div class="k">サンプル数</div><div class="v">${st.n}件</div></div>
    <div class="kpi"><div class="k">勝率</div><div class="v" style="color:${st.win_rate>=0.5?'var(--up)':'var(--text)'}">${(st.win_rate*100).toFixed(0)}%</div></div>
    <div class="kpi"><div class="k">中央値リターン</div><div class="v" style="color:${col}">${pct(st.median)}</div></div>
    <div class="kpi"><div class="k">平均リターン</div><div class="v" style="color:${st.mean>0?'var(--up)':'var(--down)'}">${pct(st.mean)}</div></div>
    <div class="kpi"><div class="k">1件${n0(DATA.notional)}円なら(中央値)</div><div class="v" style="color:${col}">${yen(st.median*DATA.notional)}</div></div>
  </div>`;
}

function matrix(){
  const rows=DATA.holds.map(h=>{
    const s=DATA.by_hold[String(h)]||{};
    const on=h===curHold?' class="sel"':'';
    if(!s.n) return `<tr${on}><td>${h===0?"当日(初値→引け)":h+"日保有"}</td><td colspan="6" class="muted">—</td></tr>`;
    return `<tr${on}><td>${h===0?"当日(初値→引け)":h+"日保有"}</td>
      <td>${s.n}</td>
      <td class="${s.win_rate>=0.5?'pos':''}">${(s.win_rate*100).toFixed(0)}%</td>
      <td class="${s.median>0?'pos':'neg'}">${pct(s.median)}</td>
      <td class="${s.mean>0?'pos':'neg'}">${pct(s.mean)}</td>
      <td class="pos">${pct(s.best)}</td>
      <td class="neg">${pct(s.worst)}</td></tr>`;
  }).join("");
  return `<section class="card"><h2>保有日数別パフォーマンス(初値=上場日始値でエントリー・外れ値除外)</h2>
    <div style="overflow-x:auto"><table>
    <thead><tr><th>戦略</th><th>件数</th><th>勝率</th><th>中央値</th><th>平均</th><th>最大</th><th>最小</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="muted" style="font-size:.75rem;margin-top:.5rem">中央値=外れ値に強い代表値。勝率が高くても中央値がマイナスなら「勝ち小・負け大」。売買手数料・スリッページ・寄り付かない銘柄の約定難は未考慮。</div>
  </section>`;
}

function equity(){
  const pts=(DATA.equity[String(curHold)])||[];
  if(pts.length<2) return `<section class="card"><h2>資金曲線</h2><div class="muted">サンプル不足で描画できません。</div></section>`;
  const W=960,H=300,padL=64,padR=20,padT=14,padB=24;
  let vals=pts.map(p=>p.pnl); vals.push(0);
  let min=Math.min(...vals),max=Math.max(...vals);const pad=(max-min)*0.08||1;min-=pad;max+=pad;
  const x=i=>padL+(i*(W-padL-padR))/(pts.length-1);
  const y=v=>padT+(H-padT-padB)*(1-(v-min)/(max-min));
  const line=pts.map((p,i)=>`${x(i)},${y(p.pnl)}`).join(" ");
  const zeroY=y(0), last=pts[pts.length-1].pnl;
  return `<section class="card">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <h2 style="margin:0">資金曲線(1件 ${n0(DATA.notional)}円投資・${curHold===0?"当日":curHold+"日"}保有・上場順)</h2>
      <div class="${last>=0?'':'neg'}" style="font-weight:700;color:${last>=0?'var(--up)':'var(--down)'}">累計 ${yen(last)}</div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".5"/>
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      <text class="glabel" x="4" y="${y(max)+4}">${n0(max)}</text>
      <text class="glabel" x="4" y="${zeroY+4}">0</text>
      <text class="glabel" x="4" y="${y(min)+4}">${n0(min)}</text>
    </svg>
    <div class="muted" style="font-size:.75rem;margin-top:.3rem">左から古いIPO→新しいIPO。各IPOのセカンダリー損益を積み上げたもの。右肩上がりなら手法に一貫した優位性。</div>
  </section>`;
}

function ipoTable(){
  const rows=DATA.ipos.slice().reverse().map(r=>{
    const ret=r.returns[String(curHold)];
    return `<tr><td>${r.debut}</td><td>${r.name}<span class="muted">(${r.code})</span></td>
      <td>${n0(r.ipo_price)}</td>
      <td class="${ret>0?'pos':'neg'}">${pct(ret)}</td>
      <td class="muted">${r.mkt_cap?(r.mkt_cap/1e8).toFixed(0)+"億":"—"}</td></tr>`;
  }).join("");
  return `<section class="card"><h2>検出したIPO一覧(新しい順・${curHold===0?"当日":curHold+"日"}保有リターン)</h2>
    <div style="overflow-x:auto;max-height:460px;overflow-y:auto"><table>
    <thead><tr><th>上場日</th><th>銘柄</th><th>初値</th><th>リターン</th><th>時価総額</th></tr></thead>
    <tbody>${rows}</tbody></table></div></section>`;
}

function excludedBox(){
  if(!DATA.excluded||!DATA.excluded.length) return "";
  const rows=DATA.excluded.map(r=>`<li>${r.debut} ${r.name}(${r.code}) — <span class="muted">${r.excluded_reason||"外れ値"}</span></li>`).join("");
  return `<section class="card" style="border-left:4px solid var(--amber)">
    <h2 style="color:var(--text)">外れ値として除外(${DATA.excluded.length}件)</h2>
    <ul class="muted" style="font-size:.85rem;line-height:1.7;margin:.2rem 0;padding-left:1.2rem">${rows}</ul>
    <div class="muted" style="font-size:.75rem">除外はキオクシア(数年に一度の外れ値)のみ。他の大型IPOはすべて統計に含めています。</div>
  </section>`;
}

function verdict(){
  const h=DATA.best_hold, s=DATA.by_hold[String(h)]||{};
  if(!s.n) return "";
  const edge=s.median>0;
  const col=edge?"var(--up)":"var(--down)";
  return `<section class="card" style="border-left:4px solid ${col}">
    <h2 style="color:var(--text);font-size:1.05rem">結論(要点)</h2>
    <div style="font-size:.95rem;line-height:1.8">
      検証期間 ${DATA.start}〜${DATA.end} に上場した <b>${DATA.n_ipos}件</b>(キオクシア等 ${DATA.n_excluded}件は除外)を対象。
      「初値で買って保有」は <b style="color:${col}">${edge?"中央値でプラス":"中央値ではプラスにできず"}</b>。
      最も中央値が高いのは <b>${h===0?"当日(初値→引け)":h+"日保有"}</b> で、
      中央値 <b style="color:${col}">${pct(s.median)}</b>・勝率 ${(s.win_rate*100).toFixed(0)}%
      ── 1件 ${n0(DATA.notional)}円なら中央で <b style="color:${col}">${yen(s.median*DATA.notional)}</b>/件。
      ${edge?"ただし平均は少数の大化けに引っ張られやすく、外れる年もあります。":"平均が正でも中央値が負なら「たまの大化け頼み」で、外すと負けが込みます。"}
    </div>
  </section>`;
}

function render(){
  document.getElementById("sub").textContent =
    `${DATA.start}〜${DATA.end} ・ 検出IPO ${DATA.n_ipos}件(除外 ${DATA.n_excluded}件) ・ 生成 ${DATA.generated_at} ・ 初値=上場日始値でエントリー`;
  const btns=DATA.holds.map(h=>`<button data-h="${h}" class="${h===curHold?'on':''}">${h===0?"当日":h+"日"}</button>`).join("");
  document.getElementById("content").innerHTML =
    verdict() +
    `<section class="card"><h2>保有日数を選択(表・資金曲線・一覧に反映)</h2><div class="btns">${btns}</div><div id="kpi">${kpis(DATA.by_hold[String(curHold)],curHold)}</div></section>` +
    matrix() + equity() + ipoTable() + excludedBox() +
    `<section class="card"><div class="disc">
      手法: 上場日の始値(初値)で買い、N営業日後の終値で売る「セカンダリー投資」。IPO抽選の当選は不要。
      IPO検出は「窓の起点に存在しない銘柄=後から上場」で自動判定(J-Quantsに上場日項目が無いため)。
      分割調整済み株価を使用。手数料・スリッページ・初値が付かない過熱IPOの約定難は未考慮。過去の成績は将来を保証しません。<b>投資助言ではありません。</b>
    </div></section>`;
  document.querySelectorAll(".btns button").forEach(b=>b.onclick=()=>{curHold=Number(b.dataset.h);render();});
}

function boot(d){DATA=d;curHold=d.best_hold!=null?d.best_hold:(d.holds&&d.holds[0]);render();}
