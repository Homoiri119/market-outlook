  let candles="";
  for(let i=0;i<n;i++){
    if(c.c[i]==null)continue;
    const up=c.c[i]>=c.o[i], col=up?CLR.up:CLR.down;
    candles+=`<line x1="${x(i)}" y1="${y(c.h[i])}" x2="${x(i)}" y2="${y(c.l[i])}" stroke="${col}" stroke-width="1"/>`;
    const yt=y(Math.max(c.o[i],c.c[i])), yb=y(Math.min(c.o[i],c.c[i]));
    candles+=`<rect x="${x(i)-cw/2}" y="${yt}" width="${cw}" height="${Math.max(1,yb-yt)}" fill="${col}"/>`;
  }
  const line=(arr,col)=>{
    let pts=[],seg="";
    for(let i=0;i<n;i++){ if(arr[i]==null){continue;} pts.push(`${x(i)},${y(arr[i])}`); }
    return pts.length>1?`<polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="1.4" opacity="0.9"/>`:"";
  };
  const hline=(v,col,label,dash)=>v==null?"":`<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="${col}" stroke-width="1.2" ${dash?'stroke-dasharray="5 3"':''} opacity="0.9"/><text x="${W-padR+3}" y="${y(v)+3}" fill="${col}" font-size="10">${label} ${Number(v).toLocaleString()}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin:.3rem 0">
    <text x="4" y="${y(hi)+8}" fill="${CLR.muted}" font-size="10">${Math.round(hi).toLocaleString()}</text>
    <text x="4" y="${y(lo)-2}" fill="${CLR.muted}" font-size="10">${Math.round(lo).toLocaleString()}</text>
    ${candles}
    ${line(c.sma25,CLR.accent)}${line(c.sma75,CLR.amber)}
    ${hline(s.entry,CLR.accent,"イン",false)}
    ${hline(s.take_profit,CLR.up,"利確",true)}
    ${hline(s.stop_loss,CLR.down,"損切",true)}
    ${hline(s.trail_stop,"#a78bfa","トレール",true)}
    ${hline(s.pullback_entry,CLR.amber,"押し目",true)}
    <text x="${padL}" y="${H-8}" fill="${CLR.muted}" font-size="9">${(c.dates[0]||"").slice(2)}</text>
    <text x="${W-padR}" y="${H-8}" fill="${CLR.muted}" font-size="9" text-anchor="end">${(c.dates[c.dates.length-1]||"").slice(2)}</text>
  </svg>
  <div class="muted" style="font-size:.68rem">青=25日線 / 橙=75日線 ・ 実線=イン ・ 点線=利確(緑)/損切(赤)/押し目(橙)</div>`;
}

function timingBadge(s){
  const map={pullback:["過熱→押し目待ち",CLR.amber],bounce:["売られすぎ→反発待ち",CLR.amber],wait:["方向確定待ち",CLR.muted],ok:["成行可",CLR.up]};
  const [lbl,col]=map[s.timing]||map.ok;
  return `<span style="border:1px solid ${col};color:${col};border-radius:999px;padding:.1rem .5rem;font-size:.72rem;font-weight:700">${lbl}</span>`;
}

function detailHtml(s){
  const ind=s.indicators||{}; const f=s.fundamentals;
  const rr=s.risk_reward!=null?`リスクリワード 1:${s.risk_reward}`:"";
  const pb = s.pullback_entry!=null ? `<div class="levels" style="margin-top:.3rem">
      <div class="lvl" style="border-color:${CLR.amber}"><div class="k">押し目イン(指値)</div><div class="v" style="color:${CLR.amber}">${n(s.pullback_entry,1)}</div><div class="k">${pct(s.pullback_pct)}(25日線)</div></div>
      <div class="lvl tp"><div class="k">押し目 利確</div><div class="v">${n(s.pullback_take_profit,1)}</div></div>
      <div class="lvl sl"><div class="k">押し目 損切り</div><div class="v">${n(s.pullback_stop_loss,1)}</div></div>
    </div>` : "";
  const trail = s.trail_stop!=null ? `<div class="levels" style="margin-top:.3rem">
      <div class="lvl" style="border-color:#a78bfa"><div class="k">トレーリング初期損切り<span style="color:#a78bfa">(推奨)</span></div><div class="v" style="color:#a78bfa">${n(s.trail_stop,1)}</div><div class="k">${pct(s.trail_pct)} ・ 高値更新で切り上げ</div></div>
      <div class="lvl" style="border-color:var(--muted)"><div class="k">トレール利確</div><div class="v" style="color:var(--muted)">なし(利を伸ばす)</div></div>
    </div>
    <div class="muted" style="font-size:.72rem;margin-top:.2rem">💡 バックテストではトレーリング(高値−2.5×ATR追随)が期待値・PF最良。固定TPで利確 or トレールで利を伸ばす、どちらかを選択。</div>` : "";
  const fund = f ? `<div class="grid2">
      <div class="cell"><span class="k">PER</span><span class="v">${f.per?f.per.toFixed(1)+"倍":"—"}</span></div>
      <div class="cell"><span class="k">PBR</span><span class="v">${f.pbr?f.pbr.toFixed(2)+"倍":"—"}</span></div>
      <div class="cell"><span class="k">配当利回り</span><span class="v">${f.dividend_yield!=null?pct(f.dividend_yield,2):"—"}</span></div>
      <div class="cell"><span class="k">EPS</span><span class="v">${f.eps?n(f.eps,1):"—"}</span></div>
      <div class="cell"><span class="k">BPS</span><span class="v">${f.bps?n(f.bps,1):"—"}</span></div>
    </div>` : `<div class="muted" style="font-size:.8rem">ファンダ(財務)データはこのプランでは未取得です。テクニカルのみで判定しています。</div>`;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem">
      <div><span style="font-size:1.15rem;font-weight:800">${s.name}</span> <span class="muted">${s.code} ・ ${s.sector||""}</span></div>
      <span class="pill ${s.direction}">${DIRJP[s.direction]}</span>
    </div>
    <div class="side">方向: <b>${s.side}</b> ・ 現値 ${n(s.current_price,1)} ・ ${rr} ・ ${timingBadge(s)}</div>
    <div style="font-size:.78rem;color:var(--muted);margin:.2rem 0">${s.entry_note||""}</div>
    ${chartSvg(s)}
    <div class="levels">
      <div class="lvl entry"><div class="k">イン(成行)</div><div class="v">${n(s.entry,1)}</div></div>
      <div class="lvl tp"><div class="k">利確(TP)</div><div class="v">${n(s.take_profit,1)}</div><div class="k">${pct(s.tp_pct)}</div></div>
      <div class="lvl sl"><div class="k">損切り(SL)</div><div class="v">${n(s.stop_loss,1)}</div><div class="k">${pct(s.sl_pct)}</div></div>
    </div>
    ${pb}
    ${trail}
    <div class="grid2">
      <div class="cell"><span class="k">RSI(14)</span><span class="v">${ind.rsi!=null?ind.rsi.toFixed(0):"—"}</span></div>
      <div class="cell"><span class="k">25日線乖離</span><span class="v ${ind.dev25>=0?'up':'down'}">${pct(ind.dev25)}</span></div>
      <div class="cell"><span class="k">ATR(14)</span><span class="v">${n(ind.atr,1)} (${pct(ind.atr_pct)})</span></div>
      <div class="cell"><span class="k">年初来高値から</span><span class="v">${pct(ind.pct_from_high)}</span></div>
      <div class="cell"><span class="k">MACDヒスト</span><span class="v ${ind.macd_hist>=0?'up':'down'}">${ind.macd_hist!=null?ind.macd_hist.toFixed(1):"—"}</span></div>
      <div class="cell"><span class="k">相対出来高</span><span class="v">${ind.rel_volume?ind.rel_volume.toFixed(2)+"x":"—"}</span></div>
      <div class="cell"><span class="k">直近安値(支持)</span><span class="v">${n(s.support,1)}</span></div>
      <div class="cell"><span class="k">直近高値(抵抗)</span><span class="v">${n(s.resistance,1)}</span></div>
    </div>
    ${fund}
    <div style="font-size:.8rem;color:var(--muted);margin-top:.5rem">判断根拠:</div>
    <ul class="reasons">${(s.reasons||[]).map(r=>`<li>${r}</li>`).join("")}</ul>
    <div class="disc">ATRベースの参考価格です(イン=現値、SL=エントリー−1.5×ATRと直近安値の低い方、TP=エントリー+2.5×ATR)。投資判断の最終責任は利用者本人にあります。</div>
  </div>`;
}

function rowsHtml(list){
  return list.map(s=>`<tr data-code="${s.code}">
    <td class="l"><b>${s.name}</b> <span class="muted">${s.code}</span></td>
    <td class="l"><span class="pill ${s.direction}">${DIRJP[s.direction]}</span></td>
    <td>${n(s.current_price,1)}</td>
    <td>${n(s.entry,1)}</td>
    <td class="tp">${n(s.take_profit,1)}</td>
    <td class="sl">${n(s.stop_loss,1)}</td>
    <td>${s.risk_reward!=null?"1:"+s.risk_reward:"—"}</td>
    <td>${s.indicators&&s.indicators.rsi!=null?s.indicators.rsi.toFixed(0):"—"}</td>
    <td class="l muted">${s.sector||""}</td>
  </tr>`).join("");
}

function apply(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const dir=document.getElementById("dir").value;
  let list=DATA.stocks.filter(s=>{
    const hit=!q || (s.code+ " "+s.name+" "+(s.sector||"")).toLowerCase().includes(q);
    const dm=!dir || s.direction===dir;
    return hit&&dm;
  });
  document.getElementById("content").innerHTML=`<div class="card" style="overflow-x:auto"><table>
    <thead><tr>
      <th class="l">銘柄</th><th class="l">方向</th><th>現値</th><th>イン</th><th>利確</th><th>損切り</th><th>R:R</th><th>RSI</th><th class="l">セクター</th>
    </tr></thead><tbody>${rowsHtml(list)}</tbody></table>
    <div class="muted" style="font-size:.78rem;margin-top:.5rem">${list.length}銘柄 ・ 行をクリックで詳細</div></div>`;
  document.querySelectorAll("tbody tr").forEach(tr=>tr.addEventListener("click",()=>{
    const s=DATA.stocks.find(x=>x.code===tr.dataset.code);
    document.getElementById("detail").innerHTML=detailHtml(s);
    window.scrollTo({top:0,behavior:"smooth"});
  }));
}

function render(data){
  DATA=data;
  document.getElementById("sub").textContent=`${data.count}銘柄 ・ 生成 ${data.generated_at} ・ 大型株+ウォッチリスト ・ ATRベース参考価格`;
  document.getElementById("disc").textContent="※ ルールベースの参考情報であり投資助言ではありません。テクニカル指標とATRから機械的に算出しています。";
  if(!data.stocks||!data.stocks.length){document.getElementById("content").innerHTML=`<div class="empty">データがありません。</div>`;return;}
  document.getElementById("detail").innerHTML=detailHtml(data.stocks[0]);
  document.getElementById("q").addEventListener("input",apply);
  document.getElementById("dir").addEventListener("change",apply);
  apply();
}

if(window.__ANALYSIS__){ render(window.__ANALYSIS__); }
else {
  fetch("./analysis.json").then(r=>r.ok?r.json():Promise.reject(r.status)).then(render)
    .catch(()=>{document.getElementById("content").innerHTML=`<div class="empty">分析データがまだありません(Stock Analysisワークフロー実行後に表示)。</div>`;});
}
</script>
</body>
</html>
