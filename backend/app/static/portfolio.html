<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>推奨銘柄の実績 | 寄り付き前アウトルック</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--panel-2:#273449;--text:#e2e8f0;--muted:#94a3b8;--line:#334155;--up:#22c55e;--down:#ef4444;--accent:#38bdf8;--amber:#f59e0b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:1.5rem 1.25rem 3rem;}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem;}
  header h1{font-size:1.15rem;margin:0;}
  .sub{color:var(--muted);font-size:.82rem;margin-bottom:1rem;}
  section.card{background:var(--panel);border-radius:16px;padding:1.25rem 1.5rem;margin-top:1rem;}
  section.card h2{font-size:.95rem;margin:0 0 .75rem;color:var(--muted);font-weight:600;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:right;padding:.45rem .55rem;border-bottom:1px solid var(--line);font-size:.86rem;}
  th:first-child,td:first-child{text-align:left;}
  td.pos{color:var(--up);}td.neg{color:var(--down);}
  .badge{display:inline-block;font-size:.7rem;padding:.1rem .45rem;border-radius:6px;}
  .b-open{background:#1e3a5f;color:#7dd3fc;}
  .b-tp{background:#14432a;color:#86efac;}
  .b-sl{background:#4c1d1d;color:#fca5a5;}
  svg{width:100%;display:block;}
  .glabel{fill:var(--muted);font-size:10px;}
  .muted{color:var(--muted);}
  .disc{font-size:.75rem;color:var(--muted);line-height:1.6;}
  .empty{color:var(--muted);padding:2rem 0;text-align:center;}
  .kpis{display:flex;gap:.6rem;flex-wrap:wrap;}
  .kpi{background:var(--panel-2);border-radius:12px;padding:.7rem 1rem;min-width:130px;flex:1;}
  .kpi .k{color:var(--muted);font-size:.72rem;}
  .kpi .v{font-size:1.25rem;font-weight:700;margin-top:.15rem;}
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav" style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.85rem">
    <a href="./index.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🗾 アウトルック</a>
    <a href="./analysis.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🔎 個別銘柄</a>
    <a href="./news.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">📰 ニュース</a>
    <a href="./portfolio.html" style="color:#052132;background:#38bdf8;text-decoration:none;border:1px solid #38bdf8;border-radius:8px;padding:.4rem .7rem;font-weight:700">💼 実績</a>
    <a href="./stock_strategy.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🧪 戦略検証</a>
    <a href="./backtest.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">📊 バックテスト</a>
    <a href="./sector_backtest.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🏭 セクター</a>
    <a href="./ipo.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🆕 IPO</a>
  </nav>

  <header><h1>💼 推奨銘柄の実績(ペーパー運用トラッキング)</h1></header>
  <div class="sub" id="sub"></div>
  <div id="content"><div class="empty">読み込み中...</div></div>
</div>
<script>
function yen(v){return v==null?"—":(v>=0?"+":"")+Math.round(v).toLocaleString()+"円";}
function yen0(v){return v==null?"—":Math.round(v).toLocaleString()+"円";}
function pct(v,d=1){return v==null?"—":(v*100>=0?"+":"")+(v*100).toFixed(d)+"%";}

let DATA=null;

function kpis(){
  const cap=DATA.initial_capital, eq=DATA.equity, dep=DATA.deployed;
  const col=DATA.total_pnl>=0?"var(--up)":"var(--down)";
  const depPct=cap? (dep/cap*100).toFixed(0):"—";
  return `<div class="kpis">
    <div class="kpi"><div class="k">運用資金</div><div class="v">${yen0(cap)}</div><div class="k">全建玉を100株買える額</div></div>
    <div class="kpi"><div class="k">評価額</div><div class="v">${yen0(eq)}</div></div>
    <div class="kpi"><div class="k">総損益(率)</div><div class="v" style="color:${col}">${pct(DATA.total_pnl_pct)}</div><div class="k" style="color:${col}">${yen(DATA.total_pnl)}</div></div>
    <div class="kpi"><div class="k">確定 / 含み</div><div class="v" style="font-size:1rem">${yen(DATA.realized)}<br>${yen(DATA.unrealized)}</div></div>
    <div class="kpi"><div class="k">投下資金(現建玉)</div><div class="v" style="font-size:1rem">${yen0(dep)}</div><div class="k">資金の${depPct}% ・ ${DATA.n_open}保有/${DATA.n_closed}決済・勝率${DATA.win_rate==null?"—":(DATA.win_rate*100).toFixed(0)+"%"}</div></div>
  </div>`;
}

function equity(){
  const pts=DATA.curve||[]; const base=DATA.initial_capital;
  if(pts.length<2) return `<section class="card"><h2>評価額の推移</h2><div class="muted">まだ推移を描くデータがありません(数日の運用後に表示)。</div></section>`;
  const W=960,H=300,padL=84,padR=20,padT=14,padB=24;
  let vals=pts.map(p=>p.equity); vals.push(base);
  let min=Math.min(...vals),max=Math.max(...vals);const pad=(max-min)*0.08||1;min-=pad;max+=pad;
  const x=i=>padL+(i*(W-padL-padR))/(pts.length-1);
  const y=v=>padT+(H-padT-padB)*(1-(v-min)/(max-min));
  const line=pts.map((p,i)=>`${x(i)},${y(p.equity)}`).join(" ");
  const baseY=y(base), last=pts[pts.length-1].equity, lastPct=base?(last-base)/base:0;
  const col=last>=base?"var(--up)":"var(--down)";
  return `<section class="card">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <h2 style="margin:0">評価額の推移</h2>
      <div style="font-weight:700;color:${col}">${yen0(last)} (${pct(lastPct)})</div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".5"/>
      <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2"/>
      <text class="glabel" x="4" y="${y(max)+4}">${Math.round(max).toLocaleString()}</text>
      <text class="glabel" x="4" y="${baseY+4}">運用資金 ${Math.round(base).toLocaleString()}</text>
      <text class="glabel" x="4" y="${y(min)+4}">${Math.round(min).toLocaleString()}</text>
    </svg>
    <div class="muted" style="font-size:.75rem;margin-top:.3rem">運用資金からの評価額。確定損益で階段状に動き、右端は含み損益も反映した現在値。</div>
  </section>`;
}

function positions(){
  const ps=DATA.positions||[];
  if(!ps.length) return `<section class="card"><h2>建玉一覧</h2><div class="muted">まだ推奨から記録された建玉がありません。</div></section>`;
  const rows=ps.map(p=>{
    const badge = p.status==="open" ? `<span class="badge b-open">保有中</span>`
      : (p.reason==="利確" ? `<span class="badge b-tp">利確</span>` : `<span class="badge b-sl">損切</span>`);
    const px = p.status==="open" ? p.last_price : p.exit_price;
    const cls = p.pnl>=0?"pos":"neg";
    return `<tr>
      <td>${p.date}</td>
      <td>${p.name}<span class="muted">(${p.code})</span> ${badge}</td>
      <td>${Math.round(p.entry).toLocaleString()}</td>
      <td class="muted">${Math.round(p.stop_loss).toLocaleString()}/${Math.round(p.take_profit).toLocaleString()}</td>
      <td>${p.shares.toLocaleString()}</td>
      <td>${px==null?"—":Math.round(px).toLocaleString()}</td>
      <td class="${cls}">${yen(p.pnl)}</td>
      <td class="${cls}">${pct(p.pnl_pct)}</td>
    </tr>`;
  }).join("");
  return `<section class="card"><h2>建玉一覧(新しい順)</h2>
    <div style="overflow-x:auto"><table>
    <thead><tr><th>推奨日</th><th>銘柄</th><th>イン</th><th>損切/利確</th><th>株数</th><th>現在/決済</th><th>損益</th><th>率</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="muted" style="font-size:.75rem;margin-top:.5rem">保有中=含み損益(直近終値で評価)。決済=損切または利確に到達して確定。買い候補に挙がった全銘柄を各100株で記録。運用資金は「全建玉を100株買える額(1万円単位で切上げ)」を自動設定するため、投下資金は常に運用資金以内です。</div>
  </section>`;
}

function render(){
  document.getElementById("sub").textContent =
    `Discordの買い候補を自動記録・追跡 ・ 運用資金 ${yen0(DATA.initial_capital)}(自動)・ 各銘柄100株 ・ 生成 ${DATA.generated_at||""}`;
  document.getElementById("content").innerHTML =
    `<section class="card">${kpis()}</section>` +
    equity() + positions() +
    `<section class="card"><div class="disc">
      毎朝Discordに出す買い候補を、推奨価格で各100株買ったと仮定して記録し、その後のJ-Quants日足で損切・利確の到達を判定します。
      運用資金は<b>保有中の全銘柄を100株買える額(1万円単位で切上げ)</b>を自動設定するので、<b>投下資金は常に運用資金以内</b>になり実口座感覚に一致します。
      エントリーは推奨価格(前日終値ベース)・手数料/スリッページ未考慮。あくまで「推奨に従っていたら」を可視化するペーパー運用です。<b>投資助言ではありません。</b>
    </div></section>`;
}

function boot(d){ DATA=d; render(); }
if(window.__PF__){ boot(window.__PF__); }
else { fetch("./portfolio.json").then(r=>r.ok?r.json():Promise.reject()).then(boot)
  .catch(()=>{document.getElementById("content").innerHTML=`<div class="empty">まだ実績データがありません(翌朝の通知以降に記録が始まります)。</div>`;});}
</script>
</body>
</html>
