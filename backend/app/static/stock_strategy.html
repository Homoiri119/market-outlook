<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>戦略検証 | 寄り付き前アウトルック</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--panel-2:#273449;--text:#e2e8f0;--muted:#94a3b8;--line:#334155;--up:#22c55e;--down:#ef4444;--accent:#38bdf8;--amber:#f59e0b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:1.5rem 1.25rem 3rem;}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem;}
  header h1{font-size:1.15rem;margin:0;}
  .sub{color:var(--muted);font-size:.82rem;margin-bottom:1rem;}
  section.card{background:var(--panel);border-radius:16px;padding:1.25rem 1.5rem;margin-top:1rem;}
  section.card h2{font-size:.95rem;margin:0 0 .75rem;color:var(--muted);font-weight:600;}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:right;padding:.5rem .6rem;border-bottom:1px solid var(--line);font-size:.9rem;}
  th:first-child,td:first-child{text-align:left;}
  td.pos{color:var(--up);}td.neg{color:var(--down);}
  svg{width:100%;display:block;}
  .glabel{fill:var(--muted);font-size:10px;}
  .legend{display:flex;gap:.9rem;font-size:.78rem;color:var(--muted);flex-wrap:wrap;}
  .legend .lg{display:flex;align-items:center;gap:.3rem;}
  .legend .sw{width:16px;height:3px;border-radius:2px;display:inline-block;}
  .muted{color:var(--muted);}
  .disc{font-size:.75rem;color:var(--muted);line-height:1.6;}
  .empty{color:var(--muted);padding:2rem 0;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav" style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.85rem">
    <a href="./index.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🗾 アウトルック</a>
    <a href="./analysis.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🔎 個別銘柄</a>
    <a href="./news.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">📰 ニュース</a>
    <a href="./portfolio.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">💼 実績</a>
    <a href="./stock_strategy.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🧪 戦略検証</a>
    <a href="./backtest.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">📊 バックテスト</a>
    <a href="./sector_backtest.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🏭 セクター</a>
    <a href="./ipo.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🆕 IPO</a>
  </nav>

  <header><h1>🧪 個別株 戦略検証(トレード・シミュレーション)</h1></header>
  <div class="sub" id="sub"></div>
  <div id="content"><div class="empty">読み込み中...</div></div>
</div>
<script>
const LABEL={base:"基本(固定TP/SL)",regime:"+レジームフィルタ",trail:"+レジーム+トレーリング"};
function pct(v,d=1){return v==null?"—":(v*100).toFixed(d)+"%";}
function num(v,d=2){return v==null?"—":Number(v).toFixed(d);}

function table(configs){
  const keys=["base","regime","trail"];
  const rows=keys.map(k=>{
    const s=configs[k]||{};
    if(!s.trades) return `<tr><td>${LABEL[k]}</td><td colspan="7" class="muted">トレードなし</td></tr>`;
    return `<tr>
      <td>${LABEL[k]}</td>
      <td>${s.trades}</td>
      <td class="${s.win_rate>=0.5?'pos':''}">${pct(s.win_rate)}</td>
      <td class="${s.expectancy_R>0?'pos':'neg'}">${num(s.expectancy_R,3)}R</td>
      <td class="${s.profit_factor>=1?'pos':'neg'}">${s.profit_factor?num(s.profit_factor,2):"—"}</td>
      <td class="pos">${num(s.avg_win_R,2)}R</td>
      <td class="neg">${num(s.avg_loss_R,2)}R</td>
      <td class="neg">${num(s.max_dd_R,1)}R</td>
    </tr>`;
  }).join("");
  return `<section class="card"><h2>設定別パフォーマンス(R倍数ベース・ロングのみ)</h2>
    <div style="overflow-x:auto"><table>
    <thead><tr><th>設定</th><th>取引数</th><th>勝率</th><th>期待値</th><th>PF</th><th>平均利益</th><th>平均損失</th><th>最大DD</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="muted" style="font-size:.75rem;margin-top:.5rem">R = 損益 ÷ 初期リスク(建値−初期損切り)。期待値>0 かつ PF>1 なら優位性あり。1トレード1Rリスク固定を想定。</div>
  </section>`;
}

function equity(configs){
  const keys=["base","regime","trail"];
  const cols={base:"#94a3b8",regime:"var(--accent)",trail:"var(--amber)"};
  const series=keys.map(k=>({k,pts:(configs[k]&&configs[k].equity)||[]})).filter(s=>s.pts.length>1);
  if(!series.length) return "";
  const W=960,H=300,padL=44,padR=90,padT=14,padB=24;
  let allR=[]; series.forEach(s=>s.pts.forEach(p=>allR.push(p.cumR))); allR.push(0);
  let min=Math.min(...allR),max=Math.max(...allR); const pad=(max-min)*0.08||1;min-=pad;max+=pad;
  // x by index position within each series (trades), normalized to max length
  const maxLen=Math.max(...series.map(s=>s.pts.length));
  const x=i=>padL+(i*(W-padL-padR))/(maxLen-1);
  const y=v=>padT+(H-padT-padB)*(1-(v-min)/(max-min));
  const lines=series.map(s=>{
    const pts=s.pts.map((p,i)=>`${x(i)},${y(p.cumR)}`).join(" ");
    const c=cols[s.k];
    return `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2"/><text x="${x(s.pts.length-1)+3}" y="${y(s.pts[s.pts.length-1].cumR)+3}" fill="${c}" font-size="10">${s.pts[s.pts.length-1].cumR.toFixed(1)}R</text>`;
  }).join("");
  const zeroY=y(0);
  const legend=series.map(s=>`<span class="lg"><span class="sw" style="background:${cols[s.k]}"></span>${LABEL[s.k]}</span>`).join("");
  return `<section class="card">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem"><h2 style="margin:0">累積損益(R・取引順)</h2><div class="legend">${legend}</div></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${padL}" y1="${zeroY}" x2="${W-padR}" y2="${zeroY}" stroke="var(--muted)" stroke-dasharray="4 4" opacity=".5"/>
      ${lines}
      <text class="glabel" x="4" y="${y(max)+4}">${max.toFixed(0)}R</text>
      <text class="glabel" x="4" y="${y(min)+4}">${min.toFixed(0)}R</text>
      <text class="glabel" x="4" y="${zeroY+4}">0</text>
    </svg></section>`;
}

function verdict(cfgs){
  const arr=Object.entries(cfgs).filter(([k,s])=>s&&s.trades);
  if(!arr.length) return "";
  const [bk,bs]=arr.sort((a,b)=>b[1].expectancy_R-a[1].expectancy_R)[0];
  const edge=bs.expectancy_R>0 && bs.profit_factor>=1;
  const yen=Math.round(bs.expectancy_R*10000);
  const col=edge?"var(--up)":"var(--down)";
  return `<section class="card" style="border-left:4px solid ${col}">
    <h2 style="color:var(--text);font-size:1.05rem">結論(要点)</h2>
    <div style="font-size:.95rem;line-height:1.8">
      この順張りルールは検証期間で <b style="color:${col}">${edge?"優位性あり":"優位性は確認できず"}</b>。
      最良の設定は <b>${LABEL[bk]}</b> で、1回の売買あたり平均 <b>${bs.expectancy_R.toFixed(3)}R</b>
      ── <b>1Rを1万円のリスク</b>に置くと平均 <b style="color:${col}">${yen>=0?"+":""}${yen.toLocaleString()}円/回</b>の期待値です。
      勝率 ${(bs.win_rate*100).toFixed(0)}% ・ プロフィットファクター ${bs.profit_factor?bs.profit_factor.toFixed(2):"—"}。
      <b>勝率が5割未満でも「勝ち幅 > 負け幅」で純プラス</b>になるのが順張りの勝ちパターンです。
    </div>
    <div class="muted" style="font-size:.75rem;margin-top:.6rem">
      <b>R(アール)</b>=1回の損益 ÷ 最初に決めた損切り幅。+1Rは「リスクと同額の利益」。
      <b>期待値R</b>=1回あたりの平均R(プラスなら優位)。<b>PF</b>=総利益÷総損失(1超で黒字)。手数料・滑りは未考慮。
    </div>
  </section>`;
}

function action(cfgs){
  const arr=Object.entries(cfgs).filter(([k,s])=>s&&s.trades);
  if(!arr.length) return "";
  const [bk,bs]=arr.sort((a,b)=>b[1].expectancy_R-a[1].expectancy_R)[0];
  const yen=Math.round(bs.expectancy_R*10000);
  return `<section class="card" style="border-left:4px solid var(--amber)">
    <h2 style="color:var(--text);font-size:1.05rem">▶ この結果を「実際の行動」に落とすと</h2>
    <ol style="font-size:.95rem;line-height:1.9;padding-left:1.2rem;margin:.3rem 0">
      <li><b>銘柄を探す</b>:上のナビ <b>🔎個別銘柄</b> を開き、方向 <b>「買い」</b> で絞る</li>
      <li><b>入る</b>:その銘柄カードの「イン(成行、または押し目=25日線の指値)」の価格で買う</li>
      <li><b>損切り・利確を置く</b>:同じカードの「損切り」「利確」、または検証で最良だった <b>トレーリング損切り</b>(高値更新で自動的に切り上げ・利確目標なしで伸ばす)</li>
      <li><b>株数を決める(ここが最重要)</b>:1回の損失を <b>資金の1%まで</b> に抑える。<br>
        <span style="font-family:monospace;background:var(--panel-2);padding:.1rem .4rem;border-radius:4px">株数 = 資金 × 1% ÷ (イン − 損切り)</span><br>
        例)資金100万円 → 1回のリスク1万円。イン2,500円・損切り2,400円(差100円)なら <b>100株</b>。</li>
      <li><b>管理する</b>:逆行したら損切りを<b>機械的に</b>実行 / 順行したらトレールを切り上げ / <b>★★★の悪材料</b>(ニュース)が出たら即撤退</li>
    </ol>
    <div class="muted" style="font-size:.8rem">
      期待値の目安:最良は <b>${LABEL[bk]}</b> で1回あたり平均 <b>${bs.expectancy_R.toFixed(3)}R</b>
      (=1Rを1万円のリスクにすると平均 <b>${yen>=0?"+":""}${yen.toLocaleString()}円/回</b>)。
      勝率 ${(bs.win_rate*100).toFixed(0)}% なので<b>連敗は普通に起きます</b> ── だから④のサイズ管理で生き残るのが肝。
      手数料・スリッページ・ばらつきで実際は目減りします。<b>投資助言ではありません。</b>
    </div>
  </section>`;
}

function render(bt){
  document.getElementById("sub").textContent=
    `大型株 ${bt.universe_size}銘柄 ・ ${bt.start}〜${bt.end} ・ 生成 ${bt.generated_at} ・ ロングのみ ・ 入口=25MA>75MA & MACD>0 の新規シグナル`;
  document.getElementById("content").innerHTML = verdict(bt.configs) + action(bt.configs) + table(bt.configs) + equity(bt.configs) +
    `<section class="card"><div class="disc">
      入口: close>25日線>75日線 かつ MACDヒスト>0 の新規点で建て。基本=初期SL(−1.5×ATR)/TP(+2.5×ATR)。
      レジーム=TOPIXが200日線の上の時のみ建て。トレーリング=シャンデリア(高値−2.5×ATR)で追随しTP無し。
      指標は因果的(先読みなし)。手数料・スリッページ・約定滑りは未考慮。R倍数はサイズ非依存の実力指標です。
      過去の成績は将来を保証しません。投資助言ではありません。
    </div></section>`;
}
if(window.__SS__){ render(window.__SS__); }
else { fetch("./stock_strategy.json").then(r=>r.ok?r.json():Promise.reject()).then(render)
  .catch(()=>{document.getElementById("content").innerHTML=`<div class="empty">結果がまだありません(Stock Strategy Backtestワークフロー実行後に表示)。</div>`;});}
</script>
</body>
</html>
