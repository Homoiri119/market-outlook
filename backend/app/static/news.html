<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ニュース・材料 | 寄り付き前アウトルック</title>
<style>
  :root{--bg:#0f172a;--panel:#1e293b;--panel-2:#273449;--text:#e2e8f0;--muted:#94a3b8;--line:#334155;--up:#22c55e;--up-bg:rgba(34,197,94,.14);--down:#ef4444;--down-bg:rgba(239,68,68,.14);--flat:#94a3b8;--flat-bg:rgba(148,163,184,.14);--accent:#38bdf8;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:1.5rem 1.25rem 3rem;}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem;}
  header h1{font-size:1.15rem;margin:0;}
  .sub{color:var(--muted);font-size:.82rem;margin-bottom:1rem;}
  .card{background:var(--panel);border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem;}
  .st-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem;}
  .pill{padding:.15rem .6rem;border-radius:999px;font-weight:700;font-size:.75rem;}
  .good{background:var(--up-bg);color:var(--up);} .bad{background:var(--down-bg);color:var(--down);} .neutral{background:var(--flat-bg);color:var(--flat);}
  ul.hl{list-style:none;margin:0;padding:0;}
  ul.hl li{padding:.4rem 0;border-top:1px solid var(--line);font-size:.9rem;line-height:1.4;}
  ul.hl li:first-child{border-top:none;}
  ul.hl a{color:var(--text);text-decoration:none;}
  ul.hl a:hover{text-decoration:underline;}
  .meta{color:var(--muted);font-size:.72rem;}
  .tag{font-size:.7rem;font-weight:700;padding:.05rem .35rem;border-radius:4px;margin-right:.3rem;}
  .tag.good{background:var(--up-bg);color:var(--up);} .tag.bad{background:var(--down-bg);color:var(--down);} .tag.mixed{background:var(--flat-bg);color:var(--text);}
  .muted{color:var(--muted);} .empty{color:var(--muted);padding:2rem 0;text-align:center;}
  .controls{margin-bottom:.75rem;}
  select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:.45rem .7rem;font-size:.85rem;}
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav" style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;font-size:.85rem">
    <a href="./index.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🗾 アウトルック</a>
    <a href="./analysis.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🔎 個別銘柄</a>
    <a href="./news.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">📰 ニュース</a>
    <a href="./stock_strategy.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🧪 戦略検証</a>
    <a href="./backtest.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">📊 バックテスト</a>
    <a href="./sector_backtest.html" style="color:#e2e8f0;text-decoration:none;border:1px solid #334155;border-radius:8px;padding:.4rem .7rem">🏭 セクター</a>
  </nav>

  <header><h1>📰 ウォッチリスト ニュース・材料</h1></header>
  <div class="sub" id="sub"></div>
  <div class="controls">
    <select id="filter">
      <option value="">全銘柄</option>
      <option value="good">好材料あり</option>
      <option value="bad">悪材料あり</option>
    </select>
  </div>
  <div id="content"><div class="empty">読み込み中...</div></div>
  <div class="muted" style="font-size:.72rem;margin-top:1rem">材料タグはキーワード辞書による自動判定です(参考)。見出し・出典は各報道機関に帰属します。投資助言ではありません。</div>
</div>
<script>
let DATA=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const SENT={good:"好材料優勢",bad:"悪材料優勢",neutral:"中立"};

function card(s){
  const hl=(s.headlines||[]).map(h=>{
    const safeLink = /^https?:\/\//.test(h.link)?h.link:"#";
    const cat = (h.category&&h.category!=="その他")
      ? `<span class="tag ${h.tag}">${esc(h.category)}${h.weight?"★".repeat(h.weight):""}</span>` : "";
    return `<li>${cat}<a href="${esc(safeLink)}" target="_blank" rel="noopener noreferrer">${esc(h.title)}</a>
      <div class="meta">${esc(h.source)} ・ ${esc(h.published)}</div></li>`;
  }).join("") || `<li class="muted">直近の該当ニュースなし</li>`;
  const chips=(s.categories||[]).map(c=>`<span class="tag mixed">${esc(c)}</span>`).join(" ");
  return `<div class="card">
    <div class="st-head">
      <div><b>${esc(s.name)}</b> <span class="muted">${esc(s.code)} ・ ${esc(s.sector)}</span></div>
      <span class="pill ${s.sentiment}">${SENT[s.sentiment]||""} ・ 重要度スコア ${s.score>0?"+":""}${s.score}</span>
    </div>
    ${chips?`<div style="margin-bottom:.4rem">${chips}</div>`:""}
    <ul class="hl">${hl}</ul>
  </div>`;
}

function apply(){
  const f=document.getElementById("filter").value;
  let list=DATA.stocks;
  if(f==="good") list=list.filter(s=>s.good>0);
  if(f==="bad") list=list.filter(s=>s.bad>0);
  document.getElementById("content").innerHTML = list.length?list.map(card).join(""):`<div class="empty">該当なし</div>`;
}

function render(d){
  DATA=d;
  document.getElementById("sub").textContent=`ウォッチリスト ${d.count}銘柄 ・ 生成 ${d.generated_at} ・ Google News RSS + 材料辞書`;
  if(!d.stocks||!d.stocks.length){document.getElementById("content").innerHTML=`<div class="empty">データがありません。watchlist.json に銘柄を追加してください。</div>`;return;}
  document.getElementById("filter").addEventListener("change",apply);
  apply();
}
if(window.__NEWS__){ render(window.__NEWS__); }
else{ fetch("./news.json").then(r=>r.ok?r.json():Promise.reject()).then(render)
  .catch(()=>{document.getElementById("content").innerHTML=`<div class="empty">ニュースデータがまだありません(Newsワークフロー実行後に表示)。</div>`;});}
</script>
</body>
</html>
